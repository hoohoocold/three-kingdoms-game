'use strict';const KEY='samguk-story-v1';const $=id=>document.getElementById(id);let S=null,tab='연대기';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initial(name){return{name,scene:'intro',year:184,month:3,stats:{무력:48,지력:47,통솔:45,매력:48,명성:0},rel:{유비:0,관우:0,장비:0,아란:0,황건적:0,조조:0,손견:0,'장각 세력':0},flags:{},hp:100,enemy:70,guard:false,turn:0,combatlog:'',log:[{time:'184년 3월',text:`${name}, 탁군 근처의 작은 마을에서 여행을 시작하다.`}],ending:false}}
const scenes={
 intro:{title:'핏빛 황혼',date:'184년 3월 · 탁군 외곽',text:'여행길에 들른 마을에 황건적이 들이닥쳤다. 불길 사이로 한 소년이 쓰러진 어머니를 붙잡고 울고 있다.\n\n멀리서 고함이 들린다. “의병을 모으는 유비라는 자가 근처에 있다!”\n\n무명의 여행자인 당신에게도 선택의 시간이 찾아왔다.',choices:[['불길 속으로 뛰어들어 사람들을 구한다','위험하지만 주민들의 신뢰를 얻을 수 있다','rescue'],['유비 일행을 찾아 지원을 청한다','인맥과 지략으로 위기를 넘긴다','seekliu'],['우선 몸을 피하고 정세를 살핀다','살아남아 더 큰 기회를 노린다','escape']]},
 rescued:{title:'불길 속의 약속',date:'184년 3월 · 폐허가 된 마을',text:'불길 속에서 사람들을 끌어낸 당신은 팔에 상처를 입었다. 목숨을 건진 소녀 아란이 마른 손으로 당신의 소매를 붙든다.\n\n“은혜를 잊지 않을게요. 그런데 어머니는 아직 저 안에 있어요.”\n\n무장한 황건적 한 명이 골목을 막아선다.',choices:[['칼을 뽑아 적을 막아선다','일기토: 위험하지만 무력을 증명할 기회','fight'],['아란을 데리고 우회로로 빠진다','기지를 발휘해 생존자를 구한다','outsmart']]},
 seekliu:{title:'짚신을 신은 사내',date:'184년 3월 · 탁군 숲길',text:'숲길에서 세 사내와 마주친다. 짚신을 신은 유비, 긴 수염의 관우, 우레 같은 목소리의 장비다.\n\n유비가 말한다. “마을이 위태롭다고? 어떤 길이 가장 빠르겠소?”',choices:[['직접 앞장서서 지름길을 안내한다','유비의 신뢰와 통솔 경험을 얻는다','guide'],['황건적의 동선을 분석해 매복을 제안한다','지략과 관우의 평가가 달라진다','ambush']]},
 escaped:{title:'떠난 자의 밤',date:'184년 3월 · 마을 밖 고갯길',text:'당신은 어둠을 틈타 마을을 벗어났다. 그러나 산등성이에서 불꽃이 사그라드는 모습을 바라보자 마음이 무거워진다.\n\n고갯길에 부상당한 병사가 쓰러져 있다. 그는 누군가에게 전달해야 할 서찰을 품고 있다.',choices:[['부상병을 치료하고 서찰을 대신 전한다','인연이 시작될 수 있다','letter'],['서찰만 챙기고 급히 떠난다','지름길을 얻지만 뒤에 문제가 생길 수 있다','takeletter']]},
 crossroads:{title:'새로운 깃발',date:'184년 4월 · 의병 진영',text:s=>`봉기는 진압되지 않았고 곳곳에서 새로운 의병이 모이고 있다. 당신의 행동은 이미 사람들의 입에 오르기 시작했다.\n\n${s.flags.saved?'아란은 당신을 알아보고 작게 고개를 숙인다. ':''}${s.flags.fled?'마을의 불길은 아직도 기억에 남아 있다. ':''}유비는 당신을 바라보며 묻는다. “그대는 앞으로 어떤 길을 가겠소?”`,choices:[['유비의 의병에 합류한다','함께 싸우며 장수로 성장한다','join'],['떠돌이 장수로 남아 스스로 길을 찾는다','자유를 얻지만 후원자는 없다','wander']]},
 joined:{title:'첫 번째 군령',date:'184년 5월 · 의병 진영',text:'유비는 당신에게 작은 병력을 맡긴다. 관우는 무기를 점검하고, 장비는 새로운 동료를 시험하듯 바라본다.\n\n정찰병이 황건적 잔당이 곡식 수송대를 습격할 것이라는 소식을 전한다.',choices:[['적의 앞길을 끊어 수송대를 지킨다','통솔 중심의 임무','convoy'],['장비와 함께 적의 우두머리를 친다','무력 중심의 임무','challenge']]},
 wandering:{title:'홀로 걷는 길',date:'184년 5월 · 길 위',text:'의병의 진영을 떠나 홀로 길을 나섰다. 길가의 주막에서는 황건적을 토벌한다는 소식과 군벌들이 병사를 모은다는 소문이 뒤섞여 흘러나온다.\n\n한 상인이 황건적 잔당에게 빼앗긴 물자를 찾아 달라고 부탁한다.',choices:[['상인의 물자를 되찾으러 간다','용기와 실력을 시험한다','convoy'],['소문을 모아 무리의 약점을 파악한다','지략으로 사건을 해결한다','rumor']]},
 final:{title:'난세의 첫 걸음',date:'184년 여름 · 탁군',text:s=>`황건적의 난은 아직 끝나지 않았다. 세상은 어지럽지만 당신의 이름을 기억하는 사람들은 조금씩 늘고 있다.\n\n${s.flags.joined?'유비의 깃발 아래 당신의 자리가 생겼다.':'어느 깃발에도 묶이지 않은 채 다음 여정을 준비한다.'}\n\n${s.flags.saved?'당신이 구했던 아란은 안전하게 살아남았다.':'마을에서의 선택은 오래도록 당신을 따라다닐 것이다.'}\n\n멀지 않은 미래에 동탁이 낙양을 뒤흔들 것이다. 그때 당신은 누구의 편에 설 것인가?`,choices:[]}
};

// v0.4 story arcs; old saves and branch flags are preserved.
scenes.crossroads={title:'깃발보다 중요한 것',date:'184년 4월 · 탁군 장터',text:s=>`전쟁은 한 번의 승리로 끝나지 않는다. 장터에는 세 가지 소문이 돌고 있었다.\n\n유비가 백성을 지킬 의병을 모은다. 관군에서는 수송대 호위를 맡길 사람을 찾는다. 황건적에서 달아난 포로는 굶주림 때문에 봉기에 가담한 사람도 있다고 말한다.\n\n${s.flags.saved?'불길에서 구한 아란은 마을의 행방불명된 사람들을 찾고 있다. ':''}${s.flags.stolen?'당신이 가져온 서찰의 행방을 찾는 병사도 있다. ':''}${s.flags.fled?'불타던 마을을 떠난 기억이 아직 마음에 남아 있다. ':''}무엇을 먼저 알아보겠는가?`,choices:[['유비의 의병 진영을 찾아간다','마을을 도운 인연을 바탕으로 의병에게 협력한다','join'],['관군 수송대의 호위 임무를 맡는다','군관의 신임을 얻으면 조조가 이끄는 부대와 접촉할 수도 있다','official'],['황건적 포로를 심문하지 말고 이야기를 듣는다','봉기에 가담한 이들의 사정을 알아본다','prisoner'],['상인들의 물자 호위를 돕는다','손견군이 활동하는 남쪽으로 향하는 상단에 동행한다','merchant']]};
scenes.joined={title:'의병의 첫 군령',date:'184년 5월 · 유비의 진영',text:s=>`유비는 정식으로 소속될 필요는 없다고 말한다. "함께 백성을 구하는 동안만 동행하셔도 좋소."\n\n관우는 수송대의 길이 좁다고 지적하고, 장비는 강행 돌파를 주장한다. ${s.flags.stolen?'그런데 당신이 이전에 가져간 서찰 때문에 한 병사가 당신을 의심한다.':''}`,choices:[['관우의 의견대로 우회로를 정찰한다','적의 매복을 피해 피해를 최소화한다','liu_scout'],['장비와 전면 돌파에 나선다','위험을 감수하고 전공을 세운다','challenge'],['유비에게 병사보다 피난민 보호를 먼저 제안한다','백성들의 신뢰를 얻지만 공략은 늦어진다','liu_refugee']]};
scenes.official={title:'관군의 명령',date:'184년 5월 · 군량 수송대',text:s=>`수송대의 지휘관은 검은 말에 올라타 서신을 내민다. "이 군량은 황건적을 토벌하는 조조 부대에 전달해야 한다."\n\n그러나 길가에서 굶주린 피난민들이 곡식을 나눠달라고 애원한다. 명령을 어기면 군율을 어길 수도 있다.`,choices:[['규정대로 모든 군량을 조조군에 전달한다','군관의 신임을 얻지만 피난민들의 불만이 커진다','cao_order'],['군량 일부를 나눠주고 사유를 보고한다','조조에게 직접 결정을 설명해야 한다','cao_share'],['근처의 버려진 창고에서 보급을 확보한다','위험한 정찰이지만 양쪽을 살릴 수 있다','cao_search']]};
scenes.prisoner={title:'황건적의 편지',date:'184년 5월 · 성밖의 움막',text:s=>`황건적 포로는 어린 동생에게 보내려던 편지를 보여준다. 거기에는 마을에 세금을 거두러 온 관리의 이름이 적혀 있다.\n\n그는 "장각의 가르침을 들었지만 모두가 전쟁을 원한 건 아니오"라고 말한다. 한편 호송병은 당장 포로를 압송하라고 명령한다.`,choices:[['포로를 데려가 정식으로 조사하게 한다','증언을 보존하면서 관군과의 충돌을 피한다','rebel_report'],['포로를 몰래 풀어주고 마을로 따라간다','반란군 거점의 실상을 직접 알아본다','rebel_follow'],['상관에게 편지와 증언을 전달한다','부패한 관리의 이름을 공개할 수 있다','rebel_letter']]};
scenes.merchant={title:'남쪽으로 향하는 상단',date:'184년 5월 · 회수 인근',text:s=>`상단은 황건적에게 빼앗긴 비단과 약재를 싣고 있었다. 도중에 손견의 군관과 마주친다. 손견의 병사들은 이 길의 안전을 확보하려 한다.\n\n수레가 늪지에 빠지자 뒤쪽에서 적의 그림자가 나타난다.`,choices:[['손견의 군관과 함께 적을 막는다','전투 실력을 보여줄 기회다','sun_fight'],['수레를 포기하고 상인부터 대피시킨다','물자를 잃어도 사람은 살릴 수 있다','sun_save'],['늪지 우회로를 찾아 수레를 옮긴다','지형을 읽는 판단이 필요하다','sun_route']]};
scenes.interlude={title:'전장의 뒤편',date:'184년 6월 · 군영과 마을 사이',text:s=>`당신이 선택한 일의 결과가 전해지고 있다.\n\n${s.flags.path==='cao'?'조조는 보급 보고서를 직접 읽고, 약속을 지키는 사람인지 당신을 시험한다.':s.flags.path==='sun'?'손견의 부하가 당신을 상단의 구원자라고 소개한다.':s.flags.path==='rebel'?'황건적 가담자들의 증언과 관군의 기록 사이에 모순이 보인다.':'유비는 당신의 판단을 듣고 동료들에게도 의견을 묻는다.'}\n\n이제 새 소식이 도착한다. 황건적 잔당이 마을의 우물 근처에 주둔하며 주민들을 인질로 잡고 있다.`,choices:[['주민들을 구할 계획을 세운다','피해를 줄이는 대신 시간이 걸린다','plan'],['직접 적의 우두머리에게 결투를 신청한다','일기토로 시간을 벌어 인질을 대피시킨다','duel'],['포로 교환을 제안한다','지금까지의 인간관계와 평판이 영향을 준다','negotiate']]};
scenes.reckoning={title:'선택이 남긴 흔적',date:'184년 7월 · 회복된 마을',text:s=>`황건적의 난은 여전히 계속되고 있다. 하지만 당신이 개입한 마을에서는 전쟁의 결과가 조금 달라졌다.\n\n${s.flags.prisonerFreed?'석방해 준 포로가 돌아와 도망칠 길을 알려 주었다.':s.flags.stolen?'앞서 가져간 서찰을 기억하는 관군이 당신을 의심한다.':'당신의 결정을 지켜본 사람들이 소문을 전한다.'}\n\n${s.flags.saved?'당신이 구한 아란은 다른 생존자를 찾아 고향에 남기로 했다.':'마을에 남은 사람들은 당신의 선택을 저마다 다르게 기억한다.'}\n\n이제 다음 목표를 결정할 때다.`,choices:[['지금의 인연을 지키며 다음 전쟁을 준비한다','선택한 세력과 관계가 유지된다','ending_covenant'],['어떤 깃발에도 묶이지 않고 여행을 이어간다','독립적인 장수로 살아간다','ending_roam']]};
scenes.endingV4={title:'제1장 · 난세의 갈림길',date:'184년 늦여름',text:s=>`전란은 멈추지 않았다. 그러나 ${s.name}의 이름은 사람들의 입에 남았다.\n\n${s.flags.path==='cao'?'조조의 군관들은 당신의 보고를 기억한다.':s.flags.path==='sun'?'남쪽에는 손견과 연결된 새로운 길이 열렸다.':s.flags.path==='rebel'?'황건적의 사정을 알게 된 당신은 어느 편이 옳은지 쉽게 단정하지 않는다.':'유비의 의병들과 나눈 약속이 앞으로의 길을 바꿀 것이다.'}\n\n${s.flags.peaceful?'인질들은 큰 희생 없이 풀려났다.':s.flags.combatWin?'당신의 결투는 군영에 오래 회자된다.':'전쟁은 상처와 책임을 남겼다.'}\n\n서기 190년, 반동탁 연합의 소식이 들려올 때, 당신은 누구와 함께할 것인가?`,choices:[]};

 liu_scout:['interlude','liu','관우의 조언을 따라 매복을 피했다.'],liu_refugee:['interlude','liu','유비와 함께 피난민을 우선 대피시켰다.'],

 rebel_report:['interlude','rebel','포로의 증언을 기록에 남겼다.'],rebel_follow:['interlude','rebel','포로를 풀어주고 황건적의 숨겨진 마을까지 따라갔다.'],rebel_letter:['interlude','rebel','부패한 관리의 이름이 담긴 편지를 상관에게 제출했다.'],

 plan:['reckoning','', '마을의 지형을 살펴 인질들이 빠져나갈 길을 만들었다.'],negotiate:['reckoning','','그동안의 인연을 이용해 포로 교환과 인질 석방을 이끌었다.'],
 ending_covenant:['endingV4','','전쟁 속에서 맺은 인연을 지키기로 결심했다.'],ending_roam:['endingV4','','다음 여정은 혼자서 결정하기로 했다.']
};
function choose(id){
 if(id==='join'){S.flags.path='liu';return legacyChoose(id)}
 if(id==='challenge'){S.flags.path='liu';return legacyChoose(id)}
 if(id==='duel'){S.flags.combat='v4';S.enemy=100;S.hp=Math.max(70,S.hp);S.turn=0;S.combatlog='적의 우두머리가 인질을 뒤로 숨겼다.';S.scene='combat';record('인질을 구하기 위해 결투를 신청했다.');save();render();return}
 if(v4Actions[id]){
 const [scene,path,story]=v4Actions[id];if(path)S.flags.path=path;
 if(id==='rebel_follow')S.flags.prisonerFreed=true;
 if(id==='plan'||id==='negotiate')S.flags.peaceful=true;
 if(id==='cao_share'||id==='sun_save'||id==='liu_refugee')mod('매력',5);
 else if(id==='cao_search'||id==='rebel_letter'||id==='sun_route'||id==='plan')mod('지력',5);
 else if(id==='sun_fight')mod('무력',5);else mod('통솔',3);
 if(id.startsWith('cao_'))rel('조조',id==='cao_share'?7:14);
 if(id.startsWith('sun_'))rel('손견',12);
 if(id.startsWith('rebel_'))rel('장각 세력',10);
 if(id.startsWith('liu_'))rel('유비',12);
 if(id==='negotiate'){const score=(S.stats.매력||0)+(S.rel['유비']||0)+(S.rel['장각 세력']||0);if(score<48){S.flags.peaceful=false;S.flags.failedParley=true;record('교섭이 실패해 일부 인질이 부상당했다.')}else mod('명성',7)}
 record(story);advance(1);S.scene=scene;save();render();return;
 }
 return legacyChoose(id)
}
function battle(action){if(S.scene!=='combat'||window.__swing)return;window.__swing=true;
 let canvas=document.querySelector('.pixel-duel');
 document.querySelectorAll('.fight-controls button').forEach(b=>b.disabled=true);
 animateDuel(canvas,action,()=>{
 if(S.flags.combat!=='v4'){legacyBattle(action)}else{
 S.turn++;let hit=action==='attack'?20:action==='defend'?8:Math.random()<.65?31:5;
 let suffered=action==='defend'?3:action==='feint'?13:10;
 S.enemy=Math.max(0,S.enemy-hit);S.hp=Math.max(0,S.hp-suffered);
 S.combatlog=`${action==='attack'?'정면 공격':action==='defend'?'방어와 반격':'기습'}: 적에게 ${hit} 피해 / 받은 피해 ${suffered}\n${S.combatlog}`;
 if(S.enemy<=0||S.hp<=0){S.flags.combatWin=S.enemy<=0;record(S.flags.combatWin?'일기토에서 승리하여 인질을 풀어주었다.':'일기토에서 패했지만 동료들이 인질을 구출했다.');S.scene='reckoning';advance(1);if(!S.flags.combatWin)S.hp=20;else mod('무력',7)}save();render();
 }
 window.__swing=false;
 });
}
function animateDuel(canvas,action,done){
 if(!canvas){done();return}let ctx=canvas.getContext('2d'),start=performance.now();
 function frame(now){const progress=Math.min(1,(now-start)/620);drawDuelFrame(canvas,progress,action);if(progress<1)requestAnimationFrame(frame);else done()}
 requestAnimationFrame(frame)
}
function drawDuelFrame(c,p,act){let ctx=c.getContext('2d');c.width=192;c.height=90;ctx.imageSmoothingEnabled=false;
 const rect=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)};
 rect(0,0,192,90,'#233348');rect(0,60,192,30,'#515044');
 for(let i=0;i<14;i++){rect(i*15,35+(i%3)*4,12,30,'#354b4e')}
 rect(0,77,192,5,'#76664b');for(let x=4;x<192;x+=13)rect(x,82,8,2,'#ab9562');
 const move=p<.5?Math.sin(p*Math.PI)*45:p<.8?45-(p-.5)*130:6;
 function man(x,shirt,right){let y=48+(p>.62&&p<.8?2:0);
 rect(x+5,y-12,10,9,'#d9a678');rect(x+4,y-15,12,4,'#333d48');rect(x+3,y-3,14,14,shirt);rect(x+4,y+11,5,12,'#232d37');rect(x+13,y+11,5,12,'#232d37');rect(x+(right?16:-3),y,4,12,'#d8b089');rect(x+(right?20:-13),y-7,3,24,'#dce3de');rect(x+(right?19:-14),y-10,5,4,'#e6eadb');}
 man(39+move,'#5ba3a0',true);man(139,'#be604c',false);
 if(p>.42&&p<.67){for(let i=0;i<9;i++)rect(108+Math.cos(i*.7)*i*1.7,41+Math.sin(i*.7)*i*1.4,3,3,i%2?'#f8df9f':'#f49c70');rect(108,41,7,8,'#fff1b7')}
 if(act==='defend'&&p>.4&&p<.7)rect(107,42,6,26,'#d5be83');
}
const originalDrawPixelScenes=drawPixelScenes;
drawPixelScenes=function(){originalDrawPixelScenes();document.querySelectorAll('.pixel-duel').forEach(c=>drawDuelFrame(c,0,'attack'))};

function record(text){S.log.unshift({time:`${S.year}년 ${S.month}월`,text});}function mod(stat,n){S.stats[stat]=Math.max(0,Math.min(100,S.stats[stat]+n))}function rel(name,n){S.rel[name]=Math.max(-100,Math.min(100,(S.rel[name]||0)+n))}function advance(month){S.month+=month;while(S.month>12){S.month-=12;S.year++}}
function legacyChoose(id){let next=null,txt='';switch(id){case'rescue':S.flags.saved=true;mod('무력',4);mod('명성',8);rel('아란',25);S.hp=85;txt='마을 주민들을 구하다. 부상을 입었지만 아란과 인연을 맺었다.';next='rescued';break;case'seekliu':mod('매력',3);rel('유비',15);txt='유비·관우·장비를 찾아 지원을 요청했다.';next='seekliu';break;case'escape':S.flags.fled=true;mod('지력',3);mod('명성',-2);txt='위험한 마을에서 탈출했다. 이 선택은 오래 기억될 것이다.';next='escaped';break;case'fight':S.flags.combat='rescue';S.enemy=65;S.hp=Math.max(65,S.hp);S.turn=0;S.combatlog='황건적이 무기를 들어 올렸다.';next='combat';txt='황건적과 일기토를 시작했다.';break;case'outsmart':mod('지력',5);mod('명성',4);rel('아란',10);txt='우회로를 찾아 아란과 주민을 구출했다.';next='crossroads';advance(1);break;case'guide':mod('통솔',5);rel('유비',15);rel('장비',6);txt='유비군을 지름길로 안내하여 마을을 도왔다.';next='crossroads';advance(1);break;case'ambush':mod('지력',6);rel('관우',12);rel('유비',8);txt='매복 계획으로 황건적을 물리쳤다.';next='crossroads';advance(1);break;case'letter':mod('매력',4);rel('유비',7);txt='부상병을 돕고 군영에 서찰을 전달했다.';next='crossroads';advance(1);break;case'takeletter':mod('지력',3);rel('유비',-5);S.flags.stolen=true;txt='부상병을 남겨두고 서찰을 챙겼다. 누군가 그 장면을 목격했다.';next='crossroads';advance(1);break;case'join':S.flags.joined=true;rel('유비',20);mod('통솔',4);txt='유비군에 합류하고 첫 부대를 맡게 되었다.';next='joined';advance(1);break;case'wander':S.flags.joined=false;mod('지력',3);txt='어떤 세력에도 들어가지 않고 떠돌이 장수로 남았다.';next='wandering';advance(1);break;case'convoy':mod('통솔',6);mod('명성',9);rel('유비',S.flags.joined?10:0);txt='수송대 습격을 막아냈다. 첫 지휘 경험이 연대기에 기록되었다.';next='interlude';advance(1);break;case'challenge':S.flags.combat='boss';S.enemy=88;S.hp=Math.min(100,S.hp+15);S.turn=0;S.combatlog='황건적 우두머리가 창을 휘둘렀다.';txt='황건적 우두머리에게 일기토를 신청했다.';next='combat';break;case'rumor':mod('지력',7);mod('명성',6);txt='황건적 잔당의 약점을 파악해 상인의 물자를 되찾았다.';next='interlude';advance(1);break}if(next){record(txt);S.scene=next;save();render()}}
function legacyBattle(action){if(S.scene!=='combat')return;S.turn++;let enemyDamage=0,myDamage=0;const roll=(a,b)=>Math.floor(a+Math.random()*(b-a+1));if(action==='attack'){enemyDamage=roll(13,24)+Math.floor(S.stats.무력/12);myDamage=roll(9,19)}if(action==='defend'){enemyDamage=roll(3,9);myDamage=roll(0,4)}if(action==='feint'){const success=Math.random()<(0.5+S.stats.지력/350);enemyDamage=success?roll(24,35):roll(3,8);myDamage=success?roll(2,10):roll(13,22)}S.enemy=Math.max(0,S.enemy-enemyDamage);S.hp=Math.max(0,S.hp-myDamage);S.combatlog=`${action==='attack'?'정면 공격':action==='defend'?'방어 태세':'기습 전술'}: 적에게 ${enemyDamage} 피해 · 받은 피해 ${myDamage}\n${S.combatlog}`;if(S.enemy===0){mod('무력',6);mod('명성',10);if(S.flags.combat==='rescue'){rel('아란',15);S.flags.saved=true;record('일기토에서 승리하여 마을 주민을 구했다.');S.scene='crossroads';advance(1)}else{rel('장비',14);record('황건적 우두머리를 쓰러뜨렸다. 장비가 실력을 인정했다.');S.flags.path='liu';S.scene='interlude';advance(1)}}else if(S.hp===0){S.hp=30;S.flags.wounded=true;mod('지력',3);record('일기토에서 패배해 부상당했다. 살아남았지만 패배를 기억한다.');S.scene=S.flags.combat==='rescue'?'crossroads':'interlude';advance(1)}save();render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function boot(){try{const raw=localStorage.getItem(KEY);if(raw){const state=JSON.parse(raw);if(state&&state.stats&&state.scene&&state.log){S=state;S.flags=S.flags||{};S.rel=S.rel||{};for(const n of ['조조','손견','장각 세력'])if(S.rel[n]===undefined)S.rel[n]=0;if(S.scene==='final')S.scene='reckoning'}}}catch(e){}render()}
function newGame(){const name=($('heroName')?.value||'').trim().slice(0,14);if(!name){alert('장수 이름을 입력해 주세요.');return}S=initial(name);save();render()}function restart(){if(confirm('현재 진행 상황을 지우고 처음부터 시작할까요?')){S=null;localStorage.removeItem(KEY);render()}}
function gameTop(){return `<div class="top"><div class="brand">삼국지 · 무명의 영웅 v0.4<small>CHRONICLES OF A NAMELESS HERO</small></div><button onclick="restart()">새로운 이야기</button></div>`}function statBox(){return `<aside class="sheet side"><h2>${esc(S.name)} <span class="muted" style="font-size:12px">· ${S.flags.path==='cao'?'관군 협력':S.flags.path==='sun'?'손견군과 인연':S.flags.path==='rebel'?'황건적 조사':S.flags.path==='liu'?'유비군 협력':S.flags.joined?'유비군 소속':'떠돌이 장수'}</span></h2><div class="stats">${Object.entries(S.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><p>몸 상태 ${S.hp}/100 · ${S.year}년 ${S.month}월</p></aside>`}
function startPage(){return `<div class="shell">${gameTop()}<section class="sheet start"><div class="hero"><canvas class="pixel-scene" width="320" height="150" aria-hidden="true"></canvas><div class="kicker">184년 · 황건적의 난</div><h1>난세의 시작</h1><p>그대의 선택이 삼국지의 역사가 된다</p></div><div class="story"><h2>새로운 장수의 이야기</h2><p>난세에 이름 없이 태어난 한 사람. 유비와 인연을 맺을 수도, 혼자 난세를 헤쳐 나갈 수도 있습니다. 선택은 시간이 흘러 다시 당신에게 돌아옵니다.</p><label for="heroName">장수 이름</label><input id="heroName" maxlength="14" placeholder="예: 조연" autocomplete="off"><button class="primary" onclick="newGame()">이야기 시작하기</button></div></section></div>`}
function battlePage(){const pct=(n,m)=>Math.max(0,Math.round(n/m*100));return `<div class="date">184년 · 황건적의 난</div><h2 class="title">칼끝에 걸린 운명</h2><p>일기토에서는 매 턴 행동을 선택합니다. 공격은 안정적이고, 방어는 피해를 줄이며, 기습은 위험하지만 큰 피해를 줍니다.</p><div class="battle"><canvas class="pixel-duel" width="240" height="100" aria-label="움직이는 도트 일기토 장면"></canvas><div class="fight-hint">검술 · 방어 · 기습 / 캐릭터가 달려가 공격합니다</div><b>${esc(S.name)} · 체력 ${S.hp}</b><div class="hp mine"><i style="width:${pct(S.hp,100)}%"></i></div><b>황건적 · 체력 ${S.enemy}</b><div class="hp"><i style="width:${pct(S.enemy,S.flags.combat==='boss'?88:65)}%"></i></div></div><div class="combatlog">${esc(S.combatlog)}</div><div class="choices fight-controls">${[['attack','정면 공격','안정적으로 적을 공격한다'],['defend','방어 태세','받는 피해를 크게 줄인다'],['feint','기습 전술','성공하면 큰 피해, 실패하면 위험']].map(([id,t,d],i)=>`<button class="choice" onclick="battle('${id}')"><span class="number">${i+1}</span><span><strong>${t}</strong><small>${d}</small></span></button>`).join('')}</div>`}
function storyPage(){if(S.scene==='combat')return battlePage();let v=scenes[S.scene]||scenes.final;return `<div class="date">${v.date}</div><h2 class="title">${v.title}</h2><div class="line"></div><div class="narrative">${esc(typeof v.text==='function'?v.text(S):v.text)}</div>${v.choices.length?`<div class="choices">${v.choices.map(([name,desc,id],i)=>`<button class="choice" onclick="choose('${id}')"><span class="number">${i+1}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div>`:`<p class="end">제1장 완료 · 다음 장을 준비할 수 있습니다.</p><div class="outcome">이야기의 기록은 연대기에서 확인할 수 있습니다. 이후 190년의 이야기는 후속 업데이트에서 이어집니다.</div><button class="primary" onclick="restart()">다른 선택으로 다시 시작</button>`}`}
function historyPage(){return `<h2>나의 연대기</h2><p>선택과 전투 결과가 날짜별로 자동 기록됩니다. 최신 기록부터 표시합니다.</p>${S.log.map(x=>`<div class="entry"><time>${esc(x.time)}</time><p>${esc(x.text)}</p></div>`).join('')}`}
function relationsPage(){return `<h2>인물 관계도</h2><p>당신의 선택에 따라 장수들의 신뢰가 변합니다.</p>${Object.entries(S.rel).filter(([k])=>k!=='황건적').map(([name,value])=>`<div class="relation"><span>${esc(name)}</span><b>${value>0?'호의 '+value:value<0?'경계 '+Math.abs(value):'아직 인연 없음'}</b></div>`).join('')}`}
function mapPage(){return `<h2>천하의 정세</h2><p>184년의 주요 도시를 단순화한 지도입니다. 현재 스토리의 무대는 탁군 일대입니다.</p><svg class="map" viewBox="0 0 480 300" role="img" aria-label="도시 위치를 단순화한 삼국지 이야기 지도"><path d="M45 78L105 24 224 31 310 15 436 71 454 141 391 247 300 285 166 264 52 205Z" fill="#d5c39d" stroke="#927e5e" stroke-width="2"/><path d="M62 190 Q140 94 221 169 T429 197" fill="none" stroke="#9bb0ae" stroke-width="18" opacity=".4"/><path d="M120 45l38 55 32-46 36 72 42-67" fill="none" stroke="#908367" stroke-width="11" opacity=".35"/>${[['탁군',352,66],['업',292,117],['낙양',224,151],['장안',143,161],['허창',252,192],['진류',319,182],['하비',377,196],['양양',216,240],['건업',375,256]].map(([n,x,y])=>`<g><circle cx="${x}" cy="${y}" r="6"/><text x="${x+10}" y="${y-9}">${n}</text></g>`).join('')}</svg><p class="footnote">※ 역사 지도를 정밀하게 재현한 것이 아닌, 이야기 이해를 위한 게임용 배치도입니다.</p>`}

function drawPixelScenes(){
  document.querySelectorAll('.pixel-scene').forEach(c=>drawScene(c,S?.scene||'intro'));
  document.querySelectorAll('.pixel-duel').forEach(c=>drawScene(c,'combat'));
}
function drawScene(canvas,scene){
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const w=160,h=75;canvas.width=w;canvas.height=h;ctx.imageSmoothingEnabled=false;
  const px=(x,y,ww,hh,color)=>{ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),ww,hh)};
  let night=['intro','rescued','escaped','combat','prisoner','reckoning'].includes(scene);
  px(0,0,w,h,night?'#232a3e':'#748c86');
  // layered mountains
  for(let x=0;x<w;x++){
    let a=28+Math.round(7*Math.sin(x*.045)+5*Math.sin(x*.11));
    px(x,a,1,h-a,night?'#41435a':'#8c9f94');
    let b=43+Math.round(5*Math.sin(x*.08+2)+4*Math.sin(x*.19));
    px(x,b,1,h-b,night?'#29384a':'#647b71');
  }
  px(0,60,w,15,night?'#38372f':'#655c43');
  for(let x=0;x<w;x+=7)px(x,65+(x%4),5,1,night?'#564a38':'#948269');
  // sun or moon and mist
  px(120,12,10,10,night?'#ddc591':'#d7c49a');
  for(let j=0;j<4;j++)px(j*43-6,47+j%3*3,27,2,'#a7aca183');
  // palisades / huts
  const house=(x,y)=>{px(x,y,22,17,'#5e4739');px(x+3,y+3,16,13,'#9e8768');for(let q=0;q<12;q++)px(x+q*2-1,y-1-Math.floor(q/3),4,2,'#524139');px(x+8,y+7,6,10,'#49382e')};
  house(12,42);house(46,47);
  if(['intro','rescued','combat'].includes(scene)){
    for(const [x,y] of [[18,40],[26,36],[57,43],[60,34]]){
      px(x,y,5,8,'#c45132');px(x+1,y-5,3,6,'#efa54f');px(x+2,y-8,2,4,'#e5c276')
    }
  }
  if(['seekliu','crossroads','joined'].includes(scene)){for(let x=10;x<140;x+=22){px(x,43,2,19,'#453f36');px(x+2,39,12,9,'#a14b3d');}}
  if(['wandering','escaped'].includes(scene))for(let x=10;x<150;x+=25){px(x,34,3,29,'#293e35');px(x-6,27,15,12,'#364a3c');}
  function warrior(x,y,tunic,helmet){
    px(x+6,y,8,7,helmet);px(x+7,y+4,6,6,'#d7a987');
    px(x+3,y+10,14,13,tunic);px(x,y+11,4,13,'#d3a482');
    px(x+17,y+11,4,13,'#d3a482');px(x+5,y+23,5,8,'#352e35');px(x+13,y+23,5,8,'#352e35');
    px(x+8,y+5,1,1,'#282c35');px(x+13,y+5,1,1,'#282c35');
  }
  warrior(scene==='combat'?42:95,39,'#406b75','#3c3e48');
  if(scene==='combat'||['intro','rescued'].includes(scene))warrior(122,39,'#9c3c31','#4a3332');
  else if(['seekliu','crossroads','joined'].includes(scene))warrior(123,39,'#416d50','#313a30');
  // bottom pixel embellishment
  px(0,73,w,2,'#1e242e');
}

function render(){const app=$('app');if(!S){app.innerHTML=startPage();drawPixelScenes();return}const v=scenes[S.scene]||scenes.final;app.innerHTML=`<div class="shell">${gameTop()}<div class="layout"><main class="sheet"><div class="hero"><canvas class="pixel-scene" width="320" height="150" aria-hidden="true"></canvas><div class="kicker">제1장 · 난세의 시작</div><h1>${S.scene==='combat'?'첫 일기토':v.title}</h1><p>184년 황건적의 난 · 선택에 따라 변화하는 이야기</p></div><div class="story">${storyPage()}</div></main>${statBox()}</div><nav class="tabs">${['연대기','인물 관계도','천하 지도'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}<button onclick="save();alert('진행 상황을 저장했습니다.')">저장</button></nav><section class="sheet tabpage">${tab==='연대기'?historyPage():tab==='인물 관계도'?relationsPage():mapPage()}</section><p class="footer">삼국지: 무명의 영웅 v0.4 · 창작 선택형 RPG · 기기의 브라우저에 자동 저장</p></div>`;drawPixelScenes()}boot();
</script></body></html>
