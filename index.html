'use strict';const KEY='samguk-story-v1';const $=id=>document.getElementById(id);let S=null,tab='연대기';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const scenes={
 intro:{title:'핏빛 황혼',date:'184년 3월 · 탁군 외곽',text:'여행길에 들른 마을에 황건적이 들이닥쳤다. 불길 사이로 한 소년이 쓰러진 어머니를 붙잡고 울고 있다.\n\n멀리서 고함이 들린다. “의병을 모으는 유비라는 자가 근처에 있다!”\n\n무명의 여행자인 당신에게도 선택의 시간이 찾아왔다.',choices:[['불길 속으로 뛰어들어 사람들을 구한다','위험하지만 주민들의 신뢰를 얻을 수 있다','rescue'],['유비 일행을 찾아 지원을 청한다','인맥과 지략으로 위기를 넘긴다','seekliu'],['우선 몸을 피하고 정세를 살핀다','살아남아 더 큰 기회를 노린다','escape']]},
 rescued:{title:'불길 속의 약속',date:'184년 3월 · 폐허가 된 마을',text:'불길 속에서 사람들을 끌어낸 당신은 팔에 상처를 입었다. 목숨을 건진 소녀 아란이 마른 손으로 당신의 소매를 붙든다.\n\n“은혜를 잊지 않을게요. 그런데 어머니는 아직 저 안에 있어요.”\n\n무장한 황건적 한 명이 골목을 막아선다.',choices:[['칼을 뽑아 적을 막아선다','일기토: 위험하지만 무력을 증명할 기회','fight'],['아란을 데리고 우회로로 빠진다','기지를 발휘해 생존자를 구한다','outsmart']]},
 seekliu:{title:'짚신을 신은 사내',date:'184년 3월 · 탁군 숲길',text:'숲길에서 세 사내와 마주친다. 짚신을 신은 유비, 긴 수염의 관우, 우레 같은 목소리의 장비다.\n\n유비가 말한다. “마을이 위태롭다고? 어떤 길이 가장 빠르겠소?”',choices:[['직접 앞장서서 지름길을 안내한다','유비의 신뢰와 통솔 경험을 얻는다','guide'],['황건적의 동선을 분석해 매복을 제안한다','지략과 관우의 평가가 달라진다','ambush']]},
 escaped:{title:'떠난 자의 밤',date:'184년 3월 · 마을 밖 고갯길',text:'당신은 어둠을 틈타 마을을 벗어났다. 그러나 산등성이에서 불꽃이 사그라드는 모습을 바라보자 마음이 무거워진다.\n\n고갯길에 부상당한 병사가 쓰러져 있다. 그는 누군가에게 전달해야 할 서찰을 품고 있다.',choices:[['부상병을 치료하고 서찰을 대신 전한다','인연이 시작될 수 있다','letter'],['서찰만 챙기고 급히 떠난다','지름길을 얻지만 뒤에 문제가 생길 수 있다','takeletter']]},
 crossroads:{title:'새로운 깃발',date:'184년 4월 · 의병 진영',text:s=>`봉기는 진압되지 않았고 곳곳에서 새로운 의병이 모이고 있다. 당신의 행동은 이미 사람들의 입에 오르기 시작했다.\n\n${s.flags.saved?'아란은 당신을 알아보고 작게 고개를 숙인다. ':''}${s.flags.fled?'마을의 불길은 아직도 기억에 남아 있다. ':''}유비는 당신을 바라보며 묻는다. “그대는 앞으로 어떤 길을 가겠소?”`,choices:[['유비의 의병에 합류한다','함께 싸우며 장수로 성장한다','join'],['떠돌이 장수로 남아 스스로 길을 찾는다','자유를 얻지만 후원자는 없다','wander']]},
 joined:{title:'첫 번째 군령',date:'184년 5월 · 의병 진영',text:'유비는 당신에게 작은 병력을 맡긴다. 관우는 무기를 점검하고, 장비는 새로운 동료를 시험하듯 바라본다.\n\n정찰병이 황건적 잔당이 곡식 수송대를 습격할 것이라는 소식을 전한다.',choices:[['적의 앞길을 끊어 수송대를 지킨다','통솔 중심의 임무','convoy'],['장비와 함께 적의 우두머리를 친다','무력 중심의 임무','challenge']]},
 wandering:{title:'홀로 걷는 길',date:'184년 5월 · 길 위',text:'의병의 진영을 떠나 홀로 길을 나섰다. 길가의 주막에서는 황건적을 토벌한다는 소식과 군벌들이 병사를 모은다는 소문이 뒤섞여 흘러나온다.\n\n한 상인이 황건적 잔당에게 빼앗긴 물자를 찾아 달라고 부탁한다.',choices:[['상인의 물자를 되찾으러 간다','용기와 실력을 시험한다','convoy'],['소문을 모아 무리의 약점을 파악한다','지략으로 사건을 해결한다','rumor']]},
 final:{title:'난세의 첫 걸음',date:'184년 여름 · 탁군',text:s=>`황건적의 난은 아직 끝나지 않았다. 세상은 어지럽지만 당신의 이름을 기억하는 사람들은 조금씩 늘고 있다.\n\n${s.flags.joined?'유비의 깃발 아래 당신의 자리가 생겼다.':'어느 깃발에도 묶이지 않은 채 다음 여정을 준비한다.'}\n\n${s.flags.saved?'당신이 구했던 아란은 안전하게 살아남았다.':'마을에서의 선택은 오래도록 당신을 따라다닐 것이다.'}\n\n멀지 않은 미래에 동탁이 낙양을 뒤흔들 것이다. 그때 당신은 누구의 편에 설 것인가?`,choices:[]}
};
function record(text){S.log.unshift({time:`${S.year}년 ${S.month}월`,text});}function mod(stat,n){S.stats[stat]=Math.max(0,Math.min(100,S.stats[stat]+n))}function rel(name,n){S.rel[name]=Math.max(-100,Math.min(100,(S.rel[name]||0)+n))}function advance(month){S.month+=month;while(S.month>12){S.month-=12;S.year++}}
function choose(id){let next=null,txt='';switch(id){case'rescue':S.flags.saved=true;mod('무력',4);mod('명성',8);rel('아란',25);S.hp=85;txt='마을 주민들을 구하다. 부상을 입었지만 아란과 인연을 맺었다.';next='rescued';break;case'seekliu':mod('매력',3);rel('유비',15);txt='유비·관우·장비를 찾아 지원을 요청했다.';next='seekliu';break;case'escape':S.flags.fled=true;mod('지력',3);mod('명성',-2);txt='위험한 마을에서 탈출했다. 이 선택은 오래 기억될 것이다.';next='escaped';break;case'fight':S.flags.combat='rescue';S.enemy=65;S.hp=Math.max(65,S.hp);S.turn=0;S.combatlog='황건적이 무기를 들어 올렸다.';next='combat';txt='황건적과 일기토를 시작했다.';break;case'outsmart':mod('지력',5);mod('명성',4);rel('아란',10);txt='우회로를 찾아 아란과 주민을 구출했다.';next='crossroads';advance(1);break;case'guide':mod('통솔',5);rel('유비',15);rel('장비',6);txt='유비군을 지름길로 안내하여 마을을 도왔다.';next='crossroads';advance(1);break;case'ambush':mod('지력',6);rel('관우',12);rel('유비',8);txt='매복 계획으로 황건적을 물리쳤다.';next='crossroads';advance(1);break;case'letter':mod('매력',4);rel('유비',7);txt='부상병을 돕고 군영에 서찰을 전달했다.';next='crossroads';advance(1);break;case'takeletter':mod('지력',3);rel('유비',-5);S.flags.stolen=true;txt='부상병을 남겨두고 서찰을 챙겼다. 누군가 그 장면을 목격했다.';next='crossroads';advance(1);break;case'join':S.flags.joined=true;rel('유비',20);mod('통솔',4);txt='유비군에 합류하고 첫 부대를 맡게 되었다.';next='joined';advance(1);break;case'wander':S.flags.joined=false;mod('지력',3);txt='어떤 세력에도 들어가지 않고 떠돌이 장수로 남았다.';next='wandering';advance(1);break;case'convoy':mod('통솔',6);mod('명성',9);rel('유비',S.flags.joined?10:0);txt='수송대 습격을 막아냈다. 첫 지휘 경험이 연대기에 기록되었다.';next='final';advance(1);break;case'challenge':S.flags.combat='boss';S.enemy=88;S.hp=Math.min(100,S.hp+15);S.turn=0;S.combatlog='황건적 우두머리가 창을 휘둘렀다.';txt='황건적 우두머리에게 일기토를 신청했다.';next='combat';break;case'rumor':mod('지력',7);mod('명성',6);txt='황건적 잔당의 약점을 파악해 상인의 물자를 되찾았다.';next='final';advance(1);break}if(next){record(txt);S.scene=next;save();render()}}
function battle(action){if(S.scene!=='combat')return;S.turn++;let enemyDamage=0,myDamage=0;const roll=(a,b)=>Math.floor(a+Math.random()*(b-a+1));if(action==='attack'){enemyDamage=roll(13,24)+Math.floor(S.stats.무력/12);myDamage=roll(9,19)}if(action==='defend'){enemyDamage=roll(3,9);myDamage=roll(0,4)}if(action==='feint'){const success=Math.random()<(0.5+S.stats.지력/350);enemyDamage=success?roll(24,35):roll(3,8);myDamage=success?roll(2,10):roll(13,22)}S.enemy=Math.max(0,S.enemy-enemyDamage);S.hp=Math.max(0,S.hp-myDamage);S.combatlog=`${action==='attack'?'정면 공격':action==='defend'?'방어 태세':'기습 전술'}: 적에게 ${enemyDamage} 피해 · 받은 피해 ${myDamage}\n${S.combatlog}`;if(S.enemy===0){mod('무력',6);mod('명성',10);if(S.flags.combat==='rescue'){rel('아란',15);S.flags.saved=true;record('일기토에서 승리하여 마을 주민을 구했다.');S.scene='crossroads';advance(1)}else{rel('장비',14);record('황건적 우두머리를 쓰러뜨렸다. 장비가 실력을 인정했다.');S.scene='final';advance(1)}}else if(S.hp===0){S.hp=30;S.flags.wounded=true;mod('지력',3);record('일기토에서 패배해 부상당했다. 살아남았지만 패배를 기억한다.');S.scene=S.flags.combat==='rescue'?'crossroads':'final';advance(1)}save();render()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function boot(){try{const raw=localStorage.getItem(KEY);if(raw){const state=JSON.parse(raw);if(state&&state.stats&&state.scene&&state.log)S=state}}catch(e){}render()}
function newGame(){const name=($('heroName')?.value||'').trim().slice(0,14);if(!name){alert('장수 이름을 입력해 주세요.');return}S=initial(name);save();render()}function restart(){if(confirm('현재 진행 상황을 지우고 처음부터 시작할까요?')){S=null;localStorage.removeItem(KEY);render()}}
function top(){return `<div class="top"><div class="brand">삼국지 · 무명의 영웅<small>CHRONICLES OF A NAMELESS HERO</small></div><button onclick="restart()">새로운 이야기</button></div>`}function statBox(){return `<aside class="sheet side"><h2>${esc(S.name)} <span class="muted" style="font-size:12px">· ${S.flags.joined?'유비군 소속':'떠돌이 장수'}</span></h2><div class="stats">${Object.entries(S.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><p>몸 상태 ${S.hp}/100 · ${S.year}년 ${S.month}월</p></aside>`}
function startPage(){return `<div class="shell">${top()}<section class="sheet start"><div class="hero"><canvas class="pixel-scene" width="320" height="150" aria-hidden="true"></canvas><div class="kicker">184년 · 황건적의 난</div><h1>난세의 시작</h1><p>그대의 선택이 삼국지의 역사가 된다</p></div><div class="story"><h2>새로운 장수의 이야기</h2><p>난세에 이름 없이 태어난 한 사람. 유비와 인연을 맺을 수도, 혼자 난세를 헤쳐 나갈 수도 있습니다. 선택은 시간이 흘러 다시 당신에게 돌아옵니다.</p><label for="heroName">장수 이름</label><input id="heroName" maxlength="14" placeholder="예: 조연" autocomplete="off"><button class="primary" onclick="newGame()">이야기 시작하기</button></div></section></div>`}
function battlePage(){const pct=(n,m)=>Math.max(0,Math.round(n/m*100));return `<div class="date">184년 · 황건적의 난</div><h2 class="title">칼끝에 걸린 운명</h2><p>일기토에서는 매 턴 행동을 선택합니다. 공격은 안정적이고, 방어는 피해를 줄이며, 기습은 위험하지만 큰 피해를 줍니다.</p><div class="battle"><canvas class="pixel-duel" width="240" height="100" aria-label="픽셀 일기토 장면"></canvas><b>${esc(S.name)} · 체력 ${S.hp}</b><div class="hp mine"><i style="width:${pct(S.hp,100)}%"></i></div><b>황건적 · 체력 ${S.enemy}</b><div class="hp"><i style="width:${pct(S.enemy,S.flags.combat==='boss'?88:65)}%"></i></div></div><div class="combatlog">${esc(S.combatlog)}</div><div class="choices">${[['attack','정면 공격','안정적으로 적을 공격한다'],['defend','방어 태세','받는 피해를 크게 줄인다'],['feint','기습 전술','성공하면 큰 피해, 실패하면 위험']].map(([id,t,d],i)=>`<button class="choice" onclick="battle('${id}')"><span class="number">${i+1}</span><span><strong>${t}</strong><small>${d}</small></span></button>`).join('')}</div>`}
function storyPage(){if(S.scene==='combat')return battlePage();let v=scenes[S.scene]||scenes.final;return `<div class="date">${v.date}</div><h2 class="title">${v.title}</h2><div class="line"></div><div class="narrative">${esc(typeof v.text==='function'?v.text(S):v.text)}</div>${v.choices.length?`<div class="choices">${v.choices.map(([name,desc,id],i)=>`<button class="choice" onclick="choose('${id}')"><span class="number">${i+1}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div>`:`<p class="end">제1장 끝 — 당신만의 역사가 시작되었다.</p><div class="outcome">이번 이야기에서 남긴 기록은 연대기에서 다시 확인할 수 있습니다. 다음 장에서는 190년 반동탁 연합으로 이야기가 이어집니다.</div><button class="primary" onclick="restart()">다른 선택으로 다시 시작</button>`}`}
function historyPage(){return `<h2>나의 연대기</h2><p>선택과 전투 결과가 날짜별로 자동 기록됩니다. 최신 기록부터 표시합니다.</p>${S.log.map(x=>`<div class="entry"><time>${esc(x.time)}</time><p>${esc(x.text)}</p></div>`).join('')}`}
function relationsPage(){return `<h2>인물 관계도</h2><p>당신의 선택에 따라 장수들의 신뢰가 변합니다.</p>${Object.entries(S.rel).filter(([k])=>k!=='황건적').map(([name,value])=>`<div class="relation"><span>${esc(name)}</span><b>${value>0?'호의 '+value:value<0?'경계 '+Math.abs(value):'아직 인연 없음'}</b></div>`).join('')}`}
function mapPage(){return `<h2>천하의 정세</h2><p>184년의 주요 도시를 단순화한 지도입니다. 현재 스토리의 무대는 탁군 일대입니다.</p><svg class="map" viewBox="0 0 480 300" role="img" aria-label="도시 위치를 단순화한 삼국지 이야기 지도"><path d="M45 78L105 24 224 31 310 15 436 71 454 141 391 247 300 285 166 264 52 205Z" fill="#d5c39d" stroke="#927e5e" stroke-width="2"/><path d="M62 190 Q140 94 221 169 T429 197" fill="none" stroke="#9bb0ae" stroke-width="18" opacity=".4"/><path d="M120 45l38 55 32-46 36 72 42-67" fill="none" stroke="#908367" stroke-width="11" opacity=".35"/>${[['탁군',352,66],['업',292,117],['낙양',224,151],['장안',143,161],['허창',252,192],['진류',319,182],['하비',377,196],['양양',216,240],['건업',375,256]].map(([n,x,y])=>`<g><circle cx="${x}" cy="${y}" r="6"/><text x="${x+10}" y="${y-9}">${n}</text></g>`).join('')}</svg><p class="footnote">※ 역사 지도를 정밀하게 재현한 것이 아닌, 이야기 이해를 위한 게임용 배치도입니다.</p>`}

function drawPixelScenes(){
  document.querySelectorAll('.pixel-scene').forEach(c=>drawScene(c,S?.scene||'intro'));
  document.querySelectorAll('.pixel-duel').forEach(c=>drawScene(c,'combat'));
}
function drawScene(canvas,scene){
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const w=160,h=75;canvas.width=w;canvas.height=h;ctx.imageSmoothingEnabled=false;
  const px=(x,y,ww,hh,color)=>{ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),ww,hh)};
  let night=['intro','rescued','escaped','combat'].includes(scene);
  px(0,0,w,h,night?'#232a3e':'#748c86');
  // layered mountains
  for(let x=0;x<w;x++){
    let a=28+Math.round(7*Math.sin(x*.045)+5*Math.sin(x*.11));
    px(x,a,1,h-a,night?'#41435a':'#8c9f94');
    let b=43+Math.round(5*Math.sin(x*.08+2)+4*Math.sin(x*.19));
    px(x,b,1,h-b,night?'#29384a':'#647b71');
  }
  px(0,60,w,15,night?'#38372f':'#655c43');
  for(let x=0;x<w;x+=7)px(x,65+(x%4),5,1,night?'#564a38':'#948269');
  // sun or moon and mist
  px(120,12,10,10,night?'#ddc591':'#d7c49a');
  for(let j=0;j<4;j++)px(j*43-6,47+j%3*3,27,2,'#a7aca183');
  // palisades / huts
  const house=(x,y)=>{px(x,y,22,17,'#5e4739');px(x+3,y+3,16,13,'#9e8768');for(let q=0;q<12;q++)px(x+q*2-1,y-1-Math.floor(q/3),4,2,'#524139');px(x+8,y+7,6,10,'#49382e')};
  house(12,42);house(46,47);
  if(['intro','rescued','combat'].includes(scene)){
    for(const [x,y] of [[18,40],[26,36],[57,43],[60,34]]){
      px(x,y,5,8,'#c45132');px(x+1,y-5,3,6,'#efa54f');px(x+2,y-8,2,4,'#e5c276')
    }
  }
  if(['seekliu','crossroads','joined'].includes(scene)){for(let x=10;x<140;x+=22){px(x,43,2,19,'#453f36');px(x+2,39,12,9,'#a14b3d');}}
  if(['wandering','escaped'].includes(scene))for(let x=10;x<150;x+=25){px(x,34,3,29,'#293e35');px(x-6,27,15,12,'#364a3c');}
  function warrior(x,y,tunic,helmet){
    px(x+6,y,8,7,helmet);px(x+7,y+4,6,6,'#d7a987');
    px(x+3,y+10,14,13,tunic);px(x,y+11,4,13,'#d3a482');
    px(x+17,y+11,4,13,'#d3a482');px(x+5,y+23,5,8,'#352e35');px(x+13,y+23,5,8,'#352e35');
    px(x+8,y+5,1,1,'#282c35');px(x+13,y+5,1,1,'#282c35');
  }
  warrior(scene==='combat'?42:95,39,'#406b75','#3c3e48');
  if(scene==='combat'||['intro','rescued'].includes(scene))warrior(122,39,'#9c3c31','#4a3332');
  else if(['seekliu','crossroads','joined'].includes(scene))warrior(123,39,'#416d50','#313a30');
  // bottom pixel embellishment
  px(0,73,w,2,'#1e242e');
}

function render(){const app=$('app');if(!S){app.innerHTML=startPage();drawPixelScenes();return}const v=scenes[S.scene]||scenes.final;app.innerHTML=`<div class="shell">${top()}<div class="layout"><main class="sheet"><div class="hero"><canvas class="pixel-scene" width="320" height="150" aria-hidden="true"></canvas><div class="kicker">제1장 · 난세의 시작</div><h1>${S.scene==='combat'?'첫 일기토':v.title}</h1><p>184년 황건적의 난 · 선택에 따라 변화하는 이야기</p></div><div class="story">${storyPage()}</div></main>${statBox()}</div><nav class="tabs">${['연대기','인물 관계도','천하 지도'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}<button onclick="save();alert('진행 상황을 저장했습니다.')">저장</button></nav><section class="sheet tabpage">${tab==='연대기'?historyPage():tab==='인물 관계도'?relationsPage():mapPage()}</section><p class="footer">삼국지: 무명의 영웅 · 개인 창작 스토리 게임 · 기기의 브라우저에 자동 저장</p></div>`;drawPixelScenes()}boot();
</script></body></html>
