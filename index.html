const scenes={
 intro:{title:'핏빛 황혼',date:'184년 3월 · 탁군 외곽',text:'여행길에 들른 마을에 황건적이 들이닥쳤다. 불길 사이로 한 소년이 쓰러진 어머니를 붙잡고 울고 있다.\n\n멀리서 고함이 들린다. “의병을 모으는 유비라는 자가 근처에 있다!”\n\n무명의 여행자인 당신에게도 선택의 시간이 찾아왔다.',choices:[['불길 속으로 뛰어들어 사람들을 구한다','위험하지만 주민들의 신뢰를 얻을 수 있다','rescue'],['유비 일행을 찾아 지원을 청한다','인맥과 지략으로 위기를 넘긴다','seekliu'],['우선 몸을 피하고 정세를 살핀다','살아남아 더 큰 기회를 노린다','escape']]},
 rescued:{title:'불길 속의 약속',date:'184년 3월 · 폐허가 된 마을',text:'불길 속에서 사람들을 끌어낸 당신은 팔에 상처를 입었다. 목숨을 건진 소녀 아란이 마른 손으로 당신의 소매를 붙든다.\n\n“은혜를 잊지 않을게요. 그런데 어머니는 아직 저 안에 있어요.”\n\n무장한 황건적 한 명이 골목을 막아선다.',choices:[['칼을 뽑아 적을 막아선다','일기토: 위험하지만 무력을 증명할 기회','fight'],['아란을 데리고 우회로로 빠진다','기지를 발휘해 생존자를 구한다','outsmart']]},
 seekliu:{title:'짚신을 신은 사내',date:'184년 3월 · 탁군 숲길',text:'숲길에서 세 사내와 마주친다. 짚신을 신은 유비, 긴 수염의 관우, 우레 같은 목소리의 장비다.\n\n유비가 말한다. “마을이 위태롭다고? 어떤 길이 가장 빠르겠소?”',choices:[['직접 앞장서서 지름길을 안내한다','유비의 신뢰와 통솔 경험을 얻는다','guide'],['황건적의 동선을 분석해 매복을 제안한다','지략과 관우의 평가가 달라진다','ambush']]},
 escaped:{title:'떠난 자의 밤',date:'184년 3월 · 마을 밖 고갯길',text:'당신은 어둠을 틈타 마을을 벗어났다. 그러나 산등성이에서 불꽃이 사그라드는 모습을 바라보자 마음이 무거워진다.\n\n고갯길에 부상당한 병사가 쓰러져 있다. 그는 누군가에게 전달해야 할 서찰을 품고 있다.',choices:[['부상병을 치료하고 서찰을 대신 전한다','인연이 시작될 수 있다','letter'],['서찰만 챙기고 급히 떠난다','지름길을 얻지만 뒤에 문제가 생길 수 있다','takeletter']]},
 crossroads:{title:'새로운 깃발',date:'184년 4월 · 의병 진영',text:s=>`봉기는 진압되지 않았고 곳곳에서 새로운 의병이 모이고 있다. 당신의 행동은 이미 사람들의 입에 오르기 시작했다.\n\n${s.flags.saved?'아란은 당신을 알아보고 작게 고개를 숙인다. ':''}${s.flags.fled?'마을의 불길은 아직도 기억에 남아 있다. ':''}유비는 당신을 바라보며 묻는다. “그대는 앞으로 어떤 길을 가겠소?”`,choices:[['유비의 의병에 합류한다','함께 싸우며 장수로 성장한다','join'],['떠돌이 장수로 남아 스스로 길을 찾는다','자유를 얻지만 후원자는 없다','wander']]},
 joined:{title:'첫 번째 군령',date:'184년 5월 · 의병 진영',text:'유비는 당신에게 작은 병력을 맡긴다. 관우는 무기를 점검하고, 장비는 새로운 동료를 시험하듯 바라본다.\n\n정찰병이 황건적 잔당이 곡식 수송대를 습격할 것이라는 소식을 전한다.',choices:[['적의 앞길을 끊어 수송대를 지킨다','통솔 중심의 임무','convoy'],['장비와 함께 적의 우두머리를 친다','무력 중심의 임무','challenge']]},
 wandering:{title:'홀로 걷는 길',date:'184년 5월 · 길 위',text:'의병의 진영을 떠나 홀로 길을 나섰다. 길가의 주막에서는 황건적을 토벌한다는 소식과 군벌들이 병사를 모은다는 소문이 뒤섞여 흘러나온다.\n\n한 상인이 황건적 잔당에게 빼앗긴 물자를 찾아 달라고 부탁한다.',choices:[['상인의 물자를 되찾으러 간다','용기와 실력을 시험한다','convoy'],['소문을 모아 무리의 약점을 파악한다','지략으로 사건을 해결한다','rumor']]},
 final:{title:'난세의 첫 걸음',date:'184년 여름 · 탁군',text:s=>`황건적의 난은 아직 끝나지 않았다. 세상은 어지럽지만 당신의 이름을 기억하는 사람들은 조금씩 늘고 있다.\n\n${s.flags.joined?'유비의 깃발 아래 당신의 자리가 생겼다.':'어느 깃발에도 묶이지 않은 채 다음 여정을 준비한다.'}\n\n${s.flags.saved?'당신이 구했던 아란은 안전하게 살아남았다.':'마을에서의 선택은 오래도록 당신을 따라다닐 것이다.'}\n\n멀지 않은 미래에 동탁이 낙양을 뒤흔들 것이다. 그때 당신은 누구의 편에 설 것인가?`,choices:[]}

scenes.crossroads={title:'깃발보다 중요한 것',date:'184년 4월 · 탁군 장터',text:s=>`전쟁은 한 번의 승리로 끝나지 않는다. 장터에는 세 가지 소문이 돌고 있었다.\n\n유비가 백성을 지킬 의병을 모은다. 관군에서는 수송대 호위를 맡길 사람을 찾는다. 황건적에서 달아난 포로는 굶주림 때문에 봉기에 가담한 사람도 있다고 말한다.\n\n${s.flags.saved?'불길에서 구한 아란은 마을의 행방불명된 사람들을 찾고 있다. ':''}${s.flags.stolen?'당신이 가져온 서찰의 행방을 찾는 병사도 있다. ':''}${s.flags.fled?'불타던 마을을 떠난 기억이 아직 마음에 남아 있다. ':''}무엇을 먼저 알아보겠는가?`,choices:[['유비의 의병 진영을 찾아간다','마을을 도운 인연을 바탕으로 의병에게 협력한다','join'],['관군 수송대의 호위 임무를 맡는다','군관의 신임을 얻으면 조조가 이끄는 부대와 접촉할 수도 있다','official'],['황건적 포로를 심문하지 말고 이야기를 듣는다','봉기에 가담한 이들의 사정을 알아본다','prisoner'],['상인들의 물자 호위를 돕는다','손견군이 활동하는 남쪽으로 향하는 상단에 동행한다','merchant']]};
scenes.joined={title:'의병의 첫 군령',date:'184년 5월 · 유비의 진영',text:s=>`유비는 정식으로 소속될 필요는 없다고 말한다. "함께 백성을 구하는 동안만 동행하셔도 좋소."\n\n관우는 수송대의 길이 좁다고 지적하고, 장비는 강행 돌파를 주장한다. ${s.flags.stolen?'그런데 당신이 이전에 가져간 서찰 때문에 한 병사가 당신을 의심한다.':''}`,choices:[['관우의 의견대로 우회로를 정찰한다','적의 매복을 피해 피해를 최소화한다','liu_scout'],['장비와 전면 돌파에 나선다','위험을 감수하고 전공을 세운다','challenge'],['유비에게 병사보다 피난민 보호를 먼저 제안한다','백성들의 신뢰를 얻지만 공략은 늦어진다','liu_refugee']]};
scenes.official={title:'관군의 명령',date:'184년 5월 · 군량 수송대',text:s=>`수송대의 지휘관은 검은 말에 올라타 서신을 내민다. "이 군량은 황건적을 토벌하는 조조 부대에 전달해야 한다."\n\n그러나 길가에서 굶주린 피난민들이 곡식을 나눠달라고 애원한다. 명령을 어기면 군율을 어길 수도 있다.`,choices:[['규정대로 모든 군량을 조조군에 전달한다','군관의 신임을 얻지만 피난민들의 불만이 커진다','cao_order'],['군량 일부를 나눠주고 사유를 보고한다','조조에게 직접 결정을 설명해야 한다','cao_share'],['근처의 버려진 창고에서 보급을 확보한다','위험한 정찰이지만 양쪽을 살릴 수 있다','cao_search']]};
scenes.prisoner={title:'황건적의 편지',date:'184년 5월 · 성밖의 움막',text:s=>`황건적 포로는 어린 동생에게 보내려던 편지를 보여준다. 거기에는 마을에 세금을 거두러 온 관리의 이름이 적혀 있다.\n\n그는 "장각의 가르침을 들었지만 모두가 전쟁을 원한 건 아니오"라고 말한다. 한편 호송병은 당장 포로를 압송하라고 명령한다.`,choices:[['포로를 데려가 정식으로 조사하게 한다','증언을 보존하면서 관군과의 충돌을 피한다','rebel_report'],['포로를 몰래 풀어주고 마을로 따라간다','반란군 거점의 실상을 직접 알아본다','rebel_follow'],['상관에게 편지와 증언을 전달한다','부패한 관리의 이름을 공개할 수 있다','rebel_letter']]};
scenes.merchant={title:'남쪽으로 향하는 상단',date:'184년 5월 · 회수 인근',text:s=>`상단은 황건적에게 빼앗긴 비단과 약재를 싣고 있었다. 도중에 손견의 군관과 마주친다. 손견의 병사들은 이 길의 안전을 확보하려 한다.\n\n수레가 늪지에 빠지자 뒤쪽에서 적의 그림자가 나타난다.`,choices:[['손견의 군관과 함께 적을 막는다','전투 실력을 보여줄 기회다','sun_fight'],['수레를 포기하고 상인부터 대피시킨다','물자를 잃어도 사람은 살릴 수 있다','sun_save'],['늪지 우회로를 찾아 수레를 옮긴다','지형을 읽는 판단이 필요하다','sun_route']]};
scenes.interlude={title:'전장의 뒤편',date:'184년 6월 · 군영과 마을 사이',text:s=>`당신이 선택한 일의 결과가 전해지고 있다.\n\n${s.flags.path==='cao'?'조조는 보급 보고서를 직접 읽고, 약속을 지키는 사람인지 당신을 시험한다.':s.flags.path==='sun'?'손견의 부하가 당신을 상단의 구원자라고 소개한다.':s.flags.path==='rebel'?'황건적 가담자들의 증언과 관군의 기록 사이에 모순이 보인다.':'유비는 당신의 판단을 듣고 동료들에게도 의견을 묻는다.'}\n\n이제 새 소식이 도착한다. 황건적 잔당이 마을의 우물 근처에 주둔하며 주민들을 인질로 잡고 있다.`,choices:[['주민들을 구할 계획을 세운다','피해를 줄이는 대신 시간이 걸린다','plan'],['직접 적의 우두머리에게 결투를 신청한다','일기토로 시간을 벌어 인질을 대피시킨다','duel'],['포로 교환을 제안한다','지금까지의 인간관계와 평판이 영향을 준다','negotiate']]};
scenes.reckoning={title:'선택이 남긴 흔적',date:'184년 7월 · 회복된 마을',text:s=>`황건적의 난은 여전히 계속되고 있다. 하지만 당신이 개입한 마을에서는 전쟁의 결과가 조금 달라졌다.\n\n${s.flags.prisonerFreed?'석방해 준 포로가 돌아와 도망칠 길을 알려 주었다.':s.flags.stolen?'앞서 가져간 서찰을 기억하는 관군이 당신을 의심한다.':'당신의 결정을 지켜본 사람들이 소문을 전한다.'}\n\n${s.flags.saved?'당신이 구한 아란은 다른 생존자를 찾아 고향에 남기로 했다.':'마을에 남은 사람들은 당신의 선택을 저마다 다르게 기억한다.'}\n\n이제 다음 목표를 결정할 때다.`,choices:[['지금의 인연을 지키며 다음 전쟁을 준비한다','선택한 세력과 관계가 유지된다','ending_covenant'],['어떤 깃발에도 묶이지 않고 여행을 이어간다','독립적인 장수로 살아간다','ending_roam']]};
scenes.endingV4={title:'제1장 · 난세의 갈림길',date:'184년 늦여름',text:s=>`전란은 멈추지 않았다. 그러나 ${s.name}의 이름은 사람들의 입에 남았다.\n\n${s.flags.path==='cao'?'조조의 군관들은 당신의 보고를 기억한다.':s.flags.path==='sun'?'남쪽에는 손견과 연결된 새로운 길이 열렸다.':s.flags.path==='rebel'?'황건적의 사정을 알게 된 당신은 어느 편이 옳은지 쉽게 단정하지 않는다.':'유비의 의병들과 나눈 약속이 앞으로의 길을 바꿀 것이다.'}\n\n${s.flags.peaceful?'인질들은 큰 희생 없이 풀려났다.':s.flags.combatWin?'당신의 결투는 군영에 오래 회자된다.':'전쟁은 상처와 책임을 남겼다.'}\n\n서기 190년, 반동탁 연합의 소식이 들려올 때, 당신은 누구와 함께할 것인가?`,choices:[['제1장 엔딩 크레딧 보기','지나온 시대와 나의 선택을 돌아본다','full_credit_1'],['장수의 삶을 돌아본다','진행 중인 기록과 장수 도감을 확인합니다','open_collection']]};

function oldChoose(id){
 if(id==='join'){S.flags.path='liu';return legacyChoose(id)}
 if(id==='challenge'){S.flags.path='liu';return legacyChoose(id)}
 if(id==='duel'){S.flags.combat='v4';S.enemy=100;S.hp=Math.max(70,S.hp);S.turn=0;S.combatlog='적의 우두머리가 인질을 뒤로 숨겼다.';S.scene='combat';record('인질을 구하기 위해 결투를 신청했다.');save();render();return}
 if(v4Actions[id]){
 const [scene,path,story]=v4Actions[id];if(path)S.flags.path=path;
 if(id==='rebel_follow')S.flags.prisonerFreed=true;
 if(id==='plan'||id==='negotiate')S.flags.peaceful=true;
 if(id==='cao_share'||id==='sun_save'||id==='liu_refugee')mod('매력',5);
 else if(id==='cao_search'||id==='rebel_letter'||id==='sun_route'||id==='plan')mod('지력',5);
 else if(id==='sun_fight')mod('무력',5);else mod('통솔',3);
 if(id.startsWith('cao_'))rel('조조',id==='cao_share'?7:14);
 if(id.startsWith('sun_'))rel('손견',12);
 if(id.startsWith('rebel_'))rel('장각 세력',10);
 if(id.startsWith('liu_'))rel('유비',12);
 if(id==='negotiate'){const score=(S.stats.매력||0)+(S.rel['유비']||0)+(S.rel['장각 세력']||0);if(score<48){S.flags.peaceful=false;S.flags.failedParley=true;record('교섭이 실패해 일부 인질이 부상당했다.')}else mod('명성',7)}
 record(story);advance(1);S.scene=scene;save();render();return;
 }
 return legacyChoose(id)
}
function legacyBattleV4(action){if(S.scene!=='combat'||window.__swing)return;window.__swing=true;
 let canvas=document.querySelector('.pixel-duel');
 document.querySelectorAll('.fight-controls button').forEach(b=>b.disabled=true);
 animateDuel(canvas,action,()=>{
 if(S.flags.combat!=='v4'){legacyBattle(action)}else{
 S.turn++;let hit=action==='attack'?20:action==='defend'?8:Math.random()<.65?31:5;
 let suffered=action==='defend'?3:action==='feint'?13:10;
 S.enemy=Math.max(0,S.enemy-hit);S.hp=Math.max(0,S.hp-suffered);
 S.combatlog=`${action==='attack'?'정면 공격':action==='defend'?'방어와 반격':'기습'}: 적에게 ${hit} 피해 / 받은 피해 ${suffered}\n${S.combatlog}`;
 if(S.enemy<=0||S.hp<=0){S.flags.combatWin=S.enemy<=0;record(S.flags.combatWin?'일기토에서 승리하여 인질을 풀어주었다.':'일기토에서 패했지만 동료들이 인질을 구출했다.');S.scene='reckoning';advance(1);if(!S.flags.combatWin)S.hp=20;else mod('무력',7)}save();render();
 }
 window.__swing=false;
 });
}
function animateDuel(canvas,action,done){
 if(!canvas){done();return}let ctx=canvas.getContext('2d'),start=performance.now();
 function frame(now){const progress=Math.min(1,(now-start)/620);drawDuelFrame(canvas,progress,action);if(progress<1)requestAnimationFrame(frame);else done()}
 requestAnimationFrame(frame)
}
function drawDuelFrame(c,p,act){let ctx=c.getContext('2d');c.width=192;c.height=90;ctx.imageSmoothingEnabled=false;
 const rect=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(Math.floor(x),Math.floor(y),w,h)};
 rect(0,0,192,90,'#233348');rect(0,60,192,30,'#515044');

function record(text){S.log.unshift({time:`${S.year}년 ${S.month}월`,text});}function mod(stat,n){S.stats[stat]=Math.max(0,Math.min(100,S.stats[stat]+n))}function rel(name,n){S.rel[name]=Math.max(-100,Math.min(100,(S.rel[name]||0)+n))}function advance(month){S.month+=month;while(S.month>12){S.month-=12;S.year++}}
function legacyChoose(id){let next=null,txt='';switch(id){case'rescue':S.flags.saved=true;mod('무력',4);mod('명성',8);rel('아란',25);S.hp=85;txt='마을 주민들을 구하다. 부상을 입었지만 아란과 인연을 맺었다.';next='rescued';break;case'seekliu':mod('매력',3);rel('유비',15);txt='유비·관우·장비를 찾아 지원을 요청했다.';next='seekliu';break;case'escape':S.flags.fled=true;mod('지력',3);mod('명성',-2);txt='위험한 마을에서 탈출했다. 이 선택은 오래 기억될 것이다.';next='escaped';break;case'fight':S.flags.combat='rescue';S.enemy=65;S.hp=Math.max(65,S.hp);S.turn=0;S.combatlog='황건적이 무기를 들어 올렸다.';next='combat';txt='황건적과 일기토를 시작했다.';break;case'outsmart':mod('지력',5);mod('명성',4);rel('아란',10);txt='우회로를 찾아 아란과 주민을 구출했다.';next='crossroads';advance(1);break;case'guide':mod('통솔',5);rel('유비',15);rel('장비',6);txt='유비군을 지름길로 안내하여 마을을 도왔다.';next='crossroads';advance(1);break;case'ambush':mod('지력',6);rel('관우',12);rel('유비',8);txt='매복 계획으로 황건적을 물리쳤다.';next='crossroads';advance(1);break;case'letter':mod('매력',4);rel('유비',7);txt='부상병을 돕고 군영에 서찰을 전달했다.';next='crossroads';advance(1);break;case'takeletter':mod('지력',3);rel('유비',-5);S.flags.stolen=true;txt='부상병을 남겨두고 서찰을 챙겼다. 누군가 그 장면을 목격했다.';next='crossroads';advance(1);break;case'join':S.flags.joined=true;rel('유비',20);mod('통솔',4);txt='유비군에 합류하고 첫 부대를 맡게 되었다.';next='joined';advance(1);break;case'wander':S.flags.joined=false;mod('지력',3);txt='어떤 세력에도 들어가지 않고 떠돌이 장수로 남았다.';next='wandering';advance(1);break;case'convoy':mod('통솔',6);mod('명성',9);rel('유비',S.flags.joined?10:0);txt='수송대 습격을 막아냈다. 첫 지휘 경험이 연대기에 기록되었다.';next='interlude';advance(1);break;case'challenge':S.flags.combat='boss';S.enemy=88;S.hp=Math.min(100,S.hp+15);S.turn=0;S.combatlog='황건적 우두머리가 창을 휘둘렀다.';txt='황건적 우두머리에게 일기토를 신청했다.';next='combat';break;case'rumor':mod('지력',7);mod('명성',6);txt='황건적 잔당의 약점을 파악해 상인의 물자를 되찾았다.';next='interlude';advance(1);break}if(next){record(txt);S.scene=next;save();render()}}
function legacyBattle(action){if(S.scene!=='combat')return;S.turn++;let enemyDamage=0,myDamage=0;const roll=(a,b)=>Math.floor(a+Math.random()*(b-a+1));if(action==='attack'){enemyDamage=roll(13,24)+Math.floor(S.stats.무력/12);myDamage=roll(9,19)}if(action==='defend'){enemyDamage=roll(3,9);myDamage=roll(0,4)}if(action==='feint'){const success=Math.random()<(0.5+S.stats.지력/350);enemyDamage=success?roll(24,35):roll(3,8);myDamage=success?roll(2,10):roll(13,22)}S.enemy=Math.max(0,S.enemy-enemyDamage);S.hp=Math.max(0,S.hp-myDamage);S.combatlog=`${action==='attack'?'정면 공격':action==='defend'?'방어 태세':'기습 전술'}: 적에게 ${enemyDamage} 피해 · 받은 피해 ${myDamage}\n${S.combatlog}`;if(S.enemy===0){mod('무력',6);mod('명성',10);if(S.flags.combat==='rescue'){rel('아란',15);S.flags.saved=true;record('일기토에서 승리하여 마을 주민을 구했다.');S.scene='crossroads';advance(1)}else{rel('장비',14);record('황건적 우두머리를 쓰러뜨렸다. 장비가 실력을 인정했다.');S.flags.path='liu';S.scene='interlude';advance(1)}}else if(S.hp===0){S.hp=30;S.flags.wounded=true;mod('지력',3);record('일기토에서 패배해 부상당했다. 살아남았지만 패배를 기억한다.');S.scene=S.flags.combat==='rescue'?'crossroads':'interlude';advance(1)}save();render()}

function drawScene(canvas,scene){
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const w=160,h=75;canvas.width=w;canvas.height=h;ctx.imageSmoothingEnabled=false;
  const px=(x,y,ww,hh,color)=>{ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),ww,hh)};
  let night=['intro','rescued','escaped','combat','prisoner','reckoning'].includes(scene);
  px(0,0,w,h,night?'#232a3e':'#748c86');
  // layered mountains
  for(let x=0;x<w;x++){
    let a=28+Math.round(7*Math.sin(x*.045)+5*Math.sin(x*.11));
    px(x,a,1,h-a,night?'#41435a':'#8c9f94');
    let b=43+Math.round(5*Math.sin(x*.08+2)+4*Math.sin(x*.19));
    px(x,b,1,h-b,night?'#29384a':'#647b71');
  }
  px(0,60,w,15,night?'#38372f':'#655c43');
  for(let x=0;x<w;x+=7)px(x,65+(x%4),5,1,night?'#564a38':'#948269');
  // sun or moon and mist
  px(120,12,10,10,night?'#ddc591':'#d7c49a');
  for(let j=0;j<4;j++)px(j*43-6,47+j%3*3,27,2,'#a7aca183');
  // palisades / huts
  const house=(x,y)=>{px(x,y,22,17,'#5e4739');px(x+3,y+3,16,13,'#9e8768');for(let q=0;q<12;q++)px(x+q*2-1,y-1-Math.floor(q/3),4,2,'#524139');px(x+8,y+7,6,10,'#49382e')};
  house(12,42);house(46,47);
  if(['intro','rescued','combat'].includes(scene)){
    for(const [x,y] of [[18,40],[26,36],[57,43],[60,34]]){
      px(x,y,5,8,'#c45132');px(x+1,y-5,3,6,'#efa54f');px(x+2,y-8,2,4,'#e5c276')
    }
  }
  if(['seekliu','crossroads','joined'].includes(scene)){for(let x=10;x<140;x+=22){px(x,43,2,19,'#453f36');px(x+2,39,12,9,'#a14b3d');}}
  if(['wandering','escaped'].includes(scene))for(let x=10;x<150;x+=25){px(x,34,3,29,'#293e35');px(x-6,27,15,12,'#364a3c');}
  function warrior(x,y,tunic,helmet){
    px(x+6,y,8,7,helmet);px(x+7,y+4,6,6,'#d7a987');
    px(x+3,y+10,14,13,tunic);px(x,y+11,4,13,'#d3a482');
    px(x+17,y+11,4,13,'#d3a482');px(x+5,y+23,5,8,'#352e35');px(x+13,y+23,5,8,'#352e35');
    px(x+8,y+5,1,1,'#282c35');px(x+13,y+5,1,1,'#282c35');
  }
  warrior(scene==='combat'?42:95,39,'#406b75','#3c3e48');
  if(scene==='combat'||['intro','rescued'].includes(scene))warrior(122,39,'#9c3c31','#4a3332');
  else if(['seekliu','crossroads','joined'].includes(scene))warrior(123,39,'#416d50','#313a30');
  // bottom pixel embellishment
  px(0,73,w,2,'#1e242e');
}

function baseRender(){const app=$('app');if(!S){app.innerHTML=startPage();drawPixelScenes();return}const v=scenes[S.scene]||scenes.final;app.innerHTML=`<div class="shell">${gameTop()}<div class="layout"><main class="sheet"><div class="hero"><canvas class="pixel-scene" width="320" height="150" aria-hidden="true"></canvas><div class="kicker">제1장 · 난세의 시작</div><h1>${S.scene==='combat'?'첫 일기토':v.title}</h1><p>184년 황건적의 난 · 선택에 따라 변화하는 이야기</p></div><div class="story">${storyPage()}</div></main>${statBox()}</div><nav class="tabs">${['연대기','인물 관계도','천하도','장수 도감'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')}<button onclick="save();alert('진행 상황을 저장했습니다.')">저장</button></nav><section class="sheet tabpage">${tab==='연대기'?historyPage():tab==='인물 관계도'?relationsPage():tab==='장수 도감'?collectionPage():mapPage()}</section><p class="footer">삼국지: 무명의 영웅 v0.7.1 · 창작 선택형 RPG · 기기의 브라우저에 자동 저장</p></div>`;drawPixelScenes()}

const ARCHIVE_KEY='samguk-retired-generals-v1';
function archives(){try{return JSON.parse(localStorage.getItem(ARCHIVE_KEY)||'[]')}catch(e){return []}}
function archiveSave(list){try{localStorage.setItem(ARCHIVE_KEY,JSON.stringify(list))}catch(e){alert('저장 공간이 부족합니다. 기록 내보내기를 이용하세요.')}}
function ensureV5(){if(!S)return;S.appearance=S.appearance||{hair:'black',robe:'teal',weapon:'sword'};S.flags=S.flags||{};S.rel=S.rel||{};S.log=S.log||[];S.stats=S.stats||{};if(!S.flags.path)S.flags.path=S.flags.joined?'liu':'free';}
const originText=s=>s.flags.path==='cao'?'조조군 수송대에서 일했던 당신에게 관군의 밀서가 도착했다.':s.flags.path==='sun'?'상단을 호위하던 당신에게 손견의 군관이 다시 찾아왔다.':s.flags.path==='rebel'?'풀어주었거나 조사했던 황건적 포로의 가족에게서 오래된 편지가 도착했다.':s.flags.path==='liu'?'탁군에서 함께 싸웠던 유비 일행이 새 군세를 모으고 있다는 소식이 들렸다.':'누구에게도 충성하지 않은 당신에게 군벌들의 모집장이 전달되었다.';
scenes.chapter2_start={title:'제2장 · 흔들리는 황실',date:'189년 가을 · 낙양의 소식',text:s=>`몇 해 동안 군영과 마을을 오가며 살아남았다. 열제 사후 낙양에서는 권력이 뒤집혔고, 동탁이 황제를 장악했다.\n\n${originText(s)}\n\n동탁에게 반대하는 세력이 비밀리에 결집한다. 하지만 과거에 누구를 도왔는지에 따라 당신을 부르는 사람도 다르다.`,choices:[['과거에 맺은 인연을 찾아간다','기존 세력의 신뢰를 활용하지만 그 세력의 책임도 함께 진다','c2_contact'],['낙양의 상황을 직접 살핀다','위험을 감수하고 동탁군 내부의 실상을 살핀다','c2_spy'],['전쟁에 휩쓸린 백성들을 먼저 돕는다','세력의 신뢰보다 백성의 안전을 선택한다','c2_refugee']]};
scenes.c2_contact={title:'오래된 인연의 값',date:'189년 겨울 · 군영',text:s=>`${s.flags.path==='cao'?'조조의 군관은 군량을 책임져 달라고 한다. 조조는 동탁에 맞서려 한다.':s.flags.path==='sun'?'손견 휘하 군관이 보급로를 안내한다. 그들은 동탁을 몰아내기 위해 북쪽으로 향한다.':s.flags.path==='rebel'?'황건적 잔당 출신 정보원이 동탁군의 징발 기록을 전한다. 그는 누구에게도 쉽게 믿음을 주지 않는다.':s.flags.path==='liu'?'유비가 당신을 알아보며 함께할 것을 제안한다. 관우는 적의 병참선을 노려야 한다고 조언한다.':'원소의 사자가 연합군의 병참 임무를 제안한다.'}\n\n이전 선택의 후광이 기회를 만들었지만, 책임도 요구한다.`,choices:[['보급과 민간인 보호를 맡는다','명성·정치 경험 상승, 전면전의 공적은 적다','c2_supply'],['전선 정찰대에 지원한다','전투 기회가 생기지만 부상 위험도 커진다','c2_scout']]};
scenes.c2_spy={title:'낙양의 검은 명령',date:'190년 정월 · 낙양 외곽',text:'동탁군 병사들이 마을에 식량과 말을 요구하고 있다. 피난민 하나가 군수 창고의 위치를 알고 있다고 속삭인다. 이 정보를 연합군에 넘기면 공격의 실마리가 되지만, 피난민이 붙잡힐 위험도 있다.',choices:[['피난민을 안전한 곳에 숨긴 뒤 정보를 전한다','늦어지지만 희생을 줄인다','c2_hide'],['먼저 정보를 전달한다','빠른 공적을 얻지만 피난민의 안전이 불확실하다','c2_fast'],['동탁군 병사를 설득해 징발을 멈춘다','협상에 실패하면 체포될 위험이 있다','c2_talk']]};
scenes.c2_refugee={title:'두 개의 마차',date:'190년 정월 · 하남의 길',text:s=>`곡식 수레가 두 대밖에 없다. 하나에는 부상병, 다른 하나에는 아이들이 타야 한다.\n\n${s.flags.prisonerFreed?'오래전 풀어준 황건적 포로가 길 안내를 돕겠다고 나선다.':'이 지역의 지형을 잘 아는 사람은 거의 없다.'} 전쟁이 가까워지며 시간이 부족해진다.`,choices:[['아이들을 먼저 대피시킨다','백성의 신뢰를 얻지만 일부 병력이 남는다','c2_children'],['부상병을 먼저 이송한다','동료들의 생존율을 높이지만 주민들이 불안해한다','c2_soldiers'],['모든 사람을 데리고 산길로 우회한다','지력에 따라 성공이 달라진다','c2_detour']]};
scenes.c2_assembly={title:'반동탁 연합의 진영',date:'190년 봄 · 산조',text:s=>`여러 군벌의 깃발이 한데 모였다. 원소가 연합의 맹주로 추대되었다. 조조와 손견은 진격을 주장하지만 각 제후는 서로를 경계한다.\n\n${s.flags.c2Rescue?'당신이 구한 피난민들이 보급을 돕는다.':'군량 수송대는 부족한 곡식으로 갈등 중이다.'} ${s.flags.c2Intel?'당신이 확보한 정보로 적 보급로가 드러났다.':'정찰병은 적의 병력을 정확히 파악하지 못했다.'}\n\n당신은 진격 작전의 한 부분을 맡아달라는 제의를 받는다.`,choices:[['선봉대와 함께 싸운다','전투로 실력을 증명한다','c2_duel'],['보급을 정비해 연합군을 돕는다','기반을 지키고 병력 손실을 줄인다','c2_logistics'],['세력 사이의 갈등을 조정한다','성공 시 협력이 강화된다','c2_diplomacy']]};
scenes.c2_aftermath={title:'승리보다 어려운 것',date:'190년 여름 · 산조 군영',text:s=>`${s.flags.c2DuelWin?'선봉대의 결투에서 승리한 이름이 군영에 퍼졌다.':s.flags.c2DuelLost?'결투에서는 패했지만 살아 돌아왔고, 동료가 후퇴를 도왔다.':s.flags.c2Diplomacy?'서로 등을 돌리던 제후들이 잠시나마 함께 움직였다.':'연합군은 보급과 명령의 혼선으로 진격이 늦어졌다.'}\n\n동탁은 낙양을 떠나 장안으로 천도했다. 연합군은 승리했다고 자축하지만 천하는 더욱 혼란스러워졌다. 전쟁은 누가 이겼는지보다 누가 살아남았는지를 남긴다.`,choices:[['전쟁이 끝나지 않았음을 받아들이고 길을 떠난다','제2장 결말과 나의 연대기 확인','c2_end'],['동료에게 자신의 기술을 전수할 제자를 찾는다','후계자 시스템을 열어둔다','c2_apprentice']]};
scenes.c2_finish={title:'제2장 완료 · 흩어진 깃발',date:'190년 가을 · 난세의 갈림길',text:s=>`반동탁 연합은 분열되고 세상에는 새로운 군벌들이 나타났다. ${s.name}의 선택은 함께 살아남은 사람들과 새로운 인연을 남겼다.\n\n${s.flags.c2Rescue?'피난민들은 당신을 은인으로 기억한다.':'일부 백성은 아직 전란을 피해 헤매고 있다.'} ${s.flags.c2Intel?'확보한 정보는 동료의 목숨을 지켰다.':''}\n\n군웅할거의 새 시대가 다가온다. 은퇴하거나 다음 장으로 여정을 계속할 수 있다.`,choices:[['이 시점에서 은퇴해 장수 도감에 기록한다','장수를 영구 기록으로 보존하고 은퇴 후일담을 본다','retire'],['장수 도감에서 내 모습을 확인한다','현재 장수와 은퇴 장수들을 살펴본다','open_collection']]};
function choose(id){if(!S)return;if(id==='open_collection'){tab='장수 도감';render();return}if(id==='chapter2_start'){ensureV5();S.year=189;S.month=9;S.scene='chapter2_start';record('동탁이 황실을 장악했다는 소식을 듣고 새로운 여정을 시작했다.');save();render();return}if(id==='retire'){retireHero();return}if(id.startsWith('c2_')){ensureV5();const f=S.flags;let note='',next='c2_assembly';let favor=0;
switch(id){
 case 'c2_contact':next='c2_contact';note='이전 인연을 찾아 각 세력의 군영으로 향했다.';break;
 case 'c2_spy':next='c2_spy';note='동탁군의 움직임을 직접 조사하기로 했다.';break;
 case 'c2_refugee':next='c2_refugee';note='피난민 구조를 우선하기로 했다.';break;
 case 'c2_supply':mod('통솔',5);f.c2Rescue=true;note='군량을 지키고 민간인 대피를 도왔다.';break;
 case 'c2_scout':mod('무력',5);f.c2Intel=true;note='전선 정찰에서 적 보급로를 찾아냈다.';break;
 case 'c2_hide':f.c2Intel=true;f.c2Rescue=true;mod('지력',5);note='피난민을 숨긴 뒤 안전하게 정보를 전달했다.';break;
 case 'c2_fast':f.c2Intel=true;mod('통솔',4);f.c2Risk=true;note='정보를 빨리 넘겼으나 정보원의 안전은 지켜주지 못했다.';break;
 case 'c2_talk':f.c2Rescue=(S.stats.매력>=50);mod('매력',3);note=f.c2Rescue?'징발대를 설득하여 민간인의 희생을 막았다.':'설득이 실패해 감시를 피해 탈출했다.';break;
 case 'c2_children':f.c2Rescue=true;mod('매력',6);note='어린아이들을 먼저 대피시켰다.';break;
 case 'c2_soldiers':mod('통솔',5);note='부상병을 구했지만 일부 피난민을 남겨두었다.';break;
 case 'c2_detour':f.c2Rescue=(S.stats.지력>=50||f.prisonerFreed);mod('지력',4);note=f.c2Rescue?'산길 우회로로 모든 사람을 데리고 빠져나왔다.':'산길에서 길을 잃어 일부 물자를 잃었다.';break;
 case 'c2_duel':f.combat='c2';S.enemy=105;S.hp=Math.max(75,S.hp);S.turn=0;S.combatlog='연합군 선봉대가 적의 결투 신청을 받았다.';next='combat';note='연합군 선봉에서 일기토를 시작했다.';break;
 case 'c2_logistics':mod('정치',5);f.c2Logistics=true;next='c2_aftermath';note='연합군의 물자를 정리해 병력 손실을 줄였다.';break;
 case 'c2_diplomacy':favor=(S.stats.매력+S.stats.지력)/2;f.c2Diplomacy=favor>=47;mod('매력',4);next='c2_aftermath';note=f.c2Diplomacy?'원소와 다른 제후 사이의 갈등을 중재했다.':'제후들의 경쟁으로 교섭이 무산되었다.';break;
 case 'c2_end':next='c2_finish';note='반동탁 연합이 흩어진 뒤에도 자신의 길을 이어가기로 했다.';break;
 case 'c2_apprentice':f.apprentice=true;next='c2_finish';note='새로운 세대에 기술을 전할 제자를 들이기로 결심했다.';break;
 default:return oldChoose(id);
}
S.scene=next;record(note);advance(1);save();render();return;}return oldChoose(id)}
// Keep the 184-year combat logic unchanged, and add a Chapter 2 combat path.
const battleV4=legacyBattleV4;
function battle(action){if(S?.flags?.combat!=='c2')return battleV4(action);if(window.__swing)return;window.__swing=true;const canvas=document.querySelector('.pixel-duel');animateDuel(canvas,action,()=>{S.turn++;let dealt=action==='attack'?23:action==='defend'?10:Math.random()<.65?31:8;let received=action==='defend'?4:action==='feint'?15:12;S.enemy=Math.max(0,S.enemy-dealt);S.hp=Math.max(0,S.hp-received);S.combatlog=`${action==='defend'?'막아내고 반격':action==='feint'?'기습 시도':'검을 휘둘러 공격'} · 적에게 ${dealt} / 받은 피해 ${received}\n${S.combatlog}`;if(S.enemy===0||S.hp===0){S.flags.c2DuelWin=S.enemy===0;S.flags.c2DuelLost=S.hp===0;S.scene='c2_aftermath';record(S.flags.c2DuelWin?'연합군 선봉의 일기토에서 승리했다.':'연합군 선봉의 일기토에서 패해 부상당했다.');if(S.hp===0)S.hp=25;advance(1)}save();render();window.__swing=false;});}
function avatar(canvas,person){if(!canvas)return;const c=canvas.getContext('2d');canvas.width=64;canvas.height=80;c.imageSmoothingEnabled=false;let a=person.appearance||{hair:'black',robe:'teal',weapon:'sword'};const coat={teal:'#488f88',red:'#ad5b50',violet:'#796298'}[a.robe]||'#488f88';const hair={black:'#222932',brown:'#694331',silver:'#d3cbaf'}[a.hair]||'#222932';const px=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};px(0,0,64,80,'#293a48');for(let i=0;i<64;i+=4)px(i,71+(i%3),3,2,'#59644f');px(21,66,9,9,'#2b333b');px(35,66,9,9,'#2b333b');px(16,35,32,30,coat);px(12,38,7,22,'#d5a57d');px(46,38,7,22,'#d5a57d');px(26,29,12,9,'#d5a57d');px(20,12,24,22,hair);px(24,17,16,17,'#dcb38a');px(22,11,20,7,hair);px(29,26,2,2,'#25272b');px(36,26,2,2,'#25272b');px(24,53,16,4,'#d0a36d');px(29,42,6,15,'#d6c4a0');if(a.weapon==='spear'){px(53,8,2,57,'#baa079');px(51,3,6,12,'#d2d5c6')}else{px(54,30,3,38,'#c1c7d0');px(52,29,7,4,'#b18b51')};}
function avatarArt(a){let str=JSON.stringify(a||{}).replaceAll('"','&quot;');return `<canvas class="officer-sprite" width="64" height="80" data-appearance="${str}"></canvas>`}
function paintAvatars(){document.querySelectorAll('.officer-sprite').forEach(c=>{let a={};try{a=JSON.parse(c.dataset.appearance)}catch(e){}avatar(c,{appearance:a})})}
function retireHero(){if(!S||S.flags.retired)return;ensureV5();const entry={id:Date.now()+'-'+Math.random().toString(36).slice(2),name:S.name,year:S.year,month:S.month,appearance:{...S.appearance},stats:{...S.stats},path:S.flags.path,apprentice:!!S.flags.apprentice,history:S.log.slice(0,60),journeys:(S.journeys||[]).map(x=>({...x})),location:S.location||"탁군",outcome:{rescued:!!S.flags.c2Rescue,intel:!!S.flags.c2Intel,duel:!!S.flags.c2DuelWin}};const all=archives();all.unshift(entry);archiveSave(all);S.flags.retired=true;S.scene='retired';record('오랜 전장을 뒤로하고 은퇴했다. 장수 도감에 일생을 남겼다.');save();tab='장수 도감';render()}
scenes.retired={title:'검을 내려놓은 날',date:'190년 가을 · 은퇴',text:s=>`${s.name}은 길었던 여정을 멈추고 전장에서 물러났다.\n\n그러나 천하는 여전히 움직인다. 플레이어가 바꾼 조건을 반영한 가상 후일담을 장수 도감에서 확인할 수 있다.`,choices:[]};
function afterlife(a){return [`191년 · 연합군이 갈라지다. ${a.outcome.rescued?'당신이 구한 이들이 피난민 공동체를 이루었다.':'북쪽의 피난민들은 새로운 보호자를 찾았다.'}`,`196년 · 군웅들의 다툼. ${a.outcome.intel?'당신의 정찰 기록이 제자와 동료들에게 군사 교본으로 전해졌다.':'각지의 군세가 다시 충돌했다.'}`,`200년 · 관도대전. ${a.path==='cao'?'조조 진영은 당신과 함께했던 보급 경험을 기억했다.':'조조와 원소의 대전이 북방의 향방을 바꾸었다.'}`,`208년 · 적벽대전. ${a.apprentice?'당신의 제자가 전장에 나섰다는 소식이 들려왔다.':'젊은 장수들이 새로운 이름을 역사에 남겼다.'}`]}
function collectionPage(){if(!S)return '';const list=archives();let cards=`<div class="officer-card current">${avatarArt(S.appearance)}<div><strong>${esc(S.name)}</strong><p>현재 플레이 중 · ${S.year}년 ${S.month}월</p><p>${Object.entries(S.stats).map(([k,v])=>esc(k)+' '+v).join(' · ')}</p></div></div>`;cards+=list.map(a=>`<details class="archive-card"><summary><span class="avatar-mini">${avatarArt(a.appearance)}</span><span><b>${esc(a.name)}</b><small>${a.year}년 은퇴 · ${a.apprentice?'제자 양성 기록 있음':'단독 여정'}</small></span></summary><div class="archive-detail"><h3>대표 능력</h3><p>${Object.entries(a.stats).map(([k,v])=>esc(k)+' '+v).join(' · ')}</p><h3>은퇴 후의 천하 (가상 역사)</h3>${(a.journeys||[]).length?`<p class="future-event">이동 기록 ${(a.journeys||[]).length}회 · 마지막 방문 도시 ${esc(a.location||"탁군")}</p>`:""}${afterlife(a).map(x=>`<p class="future-event">${esc(x)}</p>`).join('')}<h3>인생의 기록</h3>${(a.history||[]).slice(0,8).map(x=>`<p class="future-event">${esc(x.time)} · ${esc(x.text)}</p>`).join('')}</div></details>`).join('');return `<h2>나의 장수 도감</h2><p>은퇴한 장수는 게임 진행과 별도로 브라우저에 보존돼. 한 명을 누르면 기록과 은퇴 후 후일담을 볼 수 있어.</p>${cards}<button class="primary" onclick="exportCollection()">장수 도감 백업 다운로드</button><p class="footnote">브라우저 데이터를 삭제하면 기록이 사라질 수 있어. 백업 파일을 보관해 줘.</p>`;}

function ensureTravel(){if(!S)return;S.location=S.location||S.startRegion||'탁군';S.journeys=Array.isArray(S.journeys)?S.journeys:[];if(S.showTrail===undefined)S.showTrail=true;}
function cityOf(n){return WORLD_CITIES.find(c=>c.n===n)||WORLD_CITIES[1]}
function routeBetween(a,b){let q=[[a]],seen=new Set([a]);while(q.length){let p=q.shift(),n=p[p.length-1];if(n===b)return p;for(let [x,y] of WORLD_LINKS){let m=x===n?y:y===n?x:null;if(m&&!seen.has(m)){seen.add(m);q.push([...p,m])}}}return [a,b]}
function toggleTrail(){S.showTrail=!S.showTrail;save();render()}
function resetTravelView(){tab='천하도';render()}
function travelTo(target){ensureTravel();if(window.__travelBusy)return;if(target===S.location){document.getElementById('map-ticker').textContent='현재 '+target+'에 있습니다.';return}let path=routeBetween(S.location,target);window.__travelBusy=true;let start=performance.now(),duration=Math.max(850,(path.length-1)*490),origin=S.location;
function tick(now){if(tab!=='천하도'||!document.getElementById('world-map')){window.__travelBusy=false;return}let t=Math.min(1,(now-start)/duration);paintWorldMap({path,t});let msg=document.getElementById('map-ticker');if(msg)msg.textContent=`🐎 ${S.name} · ${origin} → ${target} 이동 중 ${Math.round(t*100)}%`;
if(t<1){requestAnimationFrame(tick)}else{window.__travelBusy=false;S.journeys.push({from:origin,to:target,path,date:`${S.year}년 ${S.month}월`});S.location=target;advance(Math.max(1,Math.ceil((path.length-1)/3)));record(`${origin}에서 ${target}까지 이동했다. 경유: ${path.join(' → ')}.`);save();render();}}

scenes.r07_city_done={date:'184~190년 · 여행 중',title:'길 위에 남은 선택',text:s=>`${s.location}의 사건에 대한 당신의 결정이 기록되었다. ${s.flags.r07LastOutcome||''}\n\n이곳의 소문은 다음 여행과 이후 세력 관계에도 영향을 줄 것이다.`,choices:[['원래의 여정으로 돌아간다','본래 스토리를 계속 진행한다','r07_return'],['다른 지역에서 이야기를 찾는다','천하도에서 목적지를 선택한다','r07_open_map']]};
const REGION_TEXT={탁군:'황건적의 난으로 헤어진 가족들이 서로를 찾고 있다.',진류:'군량 징발과 굶주린 주민들의 갈등이 격화됐다.',허창:'관군의 검문으로 약재가 제때 도착하지 못하고 있다.',건업:'장강을 건너던 상단이 실종돼 뱃사공들이 일을 멈췄다.',하비:'상인과 주민들이 곡식 가격을 두고 대립한다.',낙양:'동탁의 병사들이 성문을 지키고 주민을 검문한다.',장안:'관중으로 밀려든 피난민이 군량을 요청하고 있다.',업:'원소의 부하들이 새로운 동맹을 찾고 있다.',북평:'북방의 기병과 유목 집단 사이에 긴장이 높다.',양양:'형주의 관리들이 전쟁을 피해 온 사람들의 거처를 논의하고 있다.',강하:'강가의 조운선이 습격당해 통행이 막혔다.',수춘:'원술의 관리가 지나가는 상인에게 세금을 요구한다.',성도:'익주의 호족들이 외지인을 경계하고 있다.',한중:'산길을 지키는 수비대가 통행 증표를 요구한다.',무위:'서쪽의 상단이 말을 잃고 호위할 장수를 찾는다.'};
function localEvent(){return {city:S.location||'탁군',text:REGION_TEXT[S.location]||'전란 속의 새로운 소문이 들린다.'}}
function regionAction(id){const f=S.flags;let note='';if(id.startsWith('r07_')&&Object.prototype.hasOwnProperty.call(REGION_INTRO,S.startRegion)&&/^r07_(chenliu|xuchang|jiangdong|xuzhou)_/.test(id)){
const region=S.startRegion,kind=id.slice(-1);f.r07Cause=kind==='a'?'조사를 통해 숨겨진 사정을 드러냈다.':kind==='b'?'지역 군관과 협력한 사실이 알려졌다.':'주민들을 먼저 도운 행동이 기억되었다.';f.r07OriginChoice=id;let faction=region==='진류'?'조조':region==='건업'?'손견':region==='허창'?'장각 세력':'유비';if(kind==='a'){mod('지력',5);rel(faction,3)}else if(kind==='b'){mod('통솔',4);rel(faction,12)}else{mod('매력',5);mod('명성',4);rel(faction,5)}note=`${region}에서 ${f.r07Cause}`;S.scene='r07_followup';
}else if(id==='r07_to_central'){ensureTravel();f.r07ReturnScene='crossroads';S.scene='r07_city';S.location='낙양';note='중원의 사건을 조사하기 위해 낙양으로 향했다.';S.journeys.push({from:S.startRegion,to:'낙양',path:routeBetween(S.startRegion,'낙양'),date:`${S.year}년 ${S.month}월`});}
else if(id==='r07_to_main'){S.scene='crossroads';note='새로운 인연을 찾아 184년의 본편으로 돌아왔다.';}
else if(['r07_local_help','r07_local_listen','r07_local_skip'].includes(id)){let city=S.location;let name=city==='진류'?'조조':city==='건업'?'손견':city==='탁군'?'유비':city==='업'?'원소':city==='낙양'?'동탁':'지역 인물';if(id==='r07_local_help'){mod('통솔',4);mod('명성',4);rel(name,8);note=`${city}에서 ${localEvent().text} 문제 해결에 나섰다.`;}else if(id==='r07_local_listen'){mod('지력',4);rel(name,4);note=`${city}에서 사람들의 이야기를 듣고 정보를 모았다.`;}else{mod('매력',-1);note=`${city}의 사건에 관여하지 않고 지나갔다. 주민들이 그 일을 기억한다.`;}f.r07LastOutcome=note;S.scene='r07_city_done';}
else if(id==='r07_return'){S.scene=f.r07ReturnScene||'crossroads';note='지역 여행을 마치고 원래 이야기로 돌아왔다.';}
else if(id==='r07_open_map'){tab='천하도';S.scene='r07_city_done';save();render();return true}
else return false;record(note);advance(1);save();render();return true;}
const chooseBefore07=choose;
choose=function(id){if(!S)return;if(regionAction(id))return;return chooseBefore07(id)};
const travelBefore07=travelTo;
travelTo=function(target){if(!S)return;ensureTravel();if(window.__travelBusy)return;S.flags.r07ReturnScene=S.scene==='r07_city_done'?(S.flags.r07ReturnScene||'crossroads'):S.scene;let before=(S.journeys||[]).length;travelBefore07(target);if(target===S.location)return;
// Wrap the existing frame-driven travel completion without changing its sprite drawing.
const timer=setInterval(()=>{if(window.__travelBusy)return;if(S&&S.location===target&&S.journeys.length>before){clearInterval(timer);S.flags.r07Visited=S.flags.r07Visited||{};S.flags.r07Visited[target]=(S.flags.r07Visited[target]||0)+1;S.scene='r07_city';record(`${target}에 도착하여 새로운 지역 사건과 마주쳤다.`);tab='연대기';save();render();}else if(!S){clearInterval(timer)}},80);setTimeout(()=>clearInterval(timer),13000);
};
const mapBefore07=mapPage;
mapPage=function(){return mapBefore07().replaceAll('도시를 선택하면 말 탄 장수가 길을 따라 이동합니다.','원하는 도시를 방문하면 지역 사정과 과거 선택에 맞는 사건이 열립니다. 말 탄 장수가 길을 따라 이동합니다.').replace('천하도 ·','천하도 ·')};
const renderBefore07=render;
render=function(){renderBefore07();if(S){let footer=document.querySelector('.footer');if(footer)footer.textContent=footer.textContent.replace('v0.6','v0.7');}};


scenes.r08_hanzhong={date:'189년 · 한중 산길',title:'사라진 통행증',text:s=>`한중 산길의 관문에서 수비대가 일행을 멈춰 세웠다. 피난민들은 통행증을 잃어 산 아래에 갇혀 있다.\n\n수비대장은 통행 허가를 내줄 수 없다고 하지만, 짐수레 아래에는 누군가 숨겨 둔 군량 장부가 있다.\n\n${s.flags.r08HanzhongHelp?'전에 구해 준 주민이 당신을 알아보고 조심하라고 귀띔한다.':'수비대장은 당신이 누구인지 경계하고 있다.'}`,choices:[['장부의 주인을 추적한다','도난 사건을 조사해 관문을 통과할 방법을 찾는다','r08_hz_investigate'],['피난민을 위해 수비대장과 협상한다','정치·매력으로 통행 허가를 요청한다','r08_hz_negotiate'],['산길을 우회해 피난민을 호위한다','기습을 감수하고 직접 길을 연다','r08_hz_escort']]};
scenes.r08_hanzhong_result={date:'189년 · 한중 관문',title:'산길에 남은 인연',text:s=>`${s.flags.r08HanzhongOutcome||'한중에서의 일이 끝났다.'}\n\n관문은 다시 열렸지만, 이곳의 이야기는 다른 지역까지 전해질 것이다.`,choices:[['다른 지역으로 떠난다','천하도에서 새로운 목적지 선택','r08_open_map'],['한중의 남은 일을 조사한다','이 지역에서 다시 사건을 살핀다','r08_hz_revisit'],['본래 여정으로 돌아간다','현재 진행하던 본편으로 복귀','r07_return']]};
const oldRegionAction=regionAction;
regionAction=function(id){
 if(id==='r08_open_map'){tab='천하도';S.scene='r08_hanzhong_result';save();render();return true}
 if(id==='r08_hz_revisit'){S.scene='r08_hanzhong';save();render();return true}
 if(['r08_hz_investigate','r08_hz_negotiate','r08_hz_escort'].includes(id)){
  let outcomes={
   r08_hz_investigate:'장부를 조사해 군량을 빼돌린 서기를 찾아냈다. 수비대가 장부를 돌려받고 피난민의 통과를 허가했다.',
   r08_hz_negotiate:'수비대장에게 피난민의 사정을 설명하고 대신 물자를 운반하기로 약속했다. 그가 한시적으로 관문을 열었다.',
   r08_hz_escort:'밤중에 산길로 피난민을 호위했다. 도적에게 습격받았지만 무사히 길을 건넜고 주민들이 당신을 기억하게 됐다.'
  };
  S.flags.r08HanzhongHelp=true;S.flags.r08HanzhongOutcome=outcomes[id];
  if(id==='r08_hz_investigate'){mod('지력',5);mod('명성',2)}
  else if(id==='r08_hz_negotiate'){mod('정치',4);mod('매력',3)}
  else{mod('통솔',4);mod('명성',4)}
  record('한중: '+outcomes[id]);advance(1);S.scene='r08_hanzhong_result';save();render();return true;
 }
 return oldRegionAction(id);
};
const oldLocalEvent=localEvent;
localEvent=function(){if(S&&S.location==='한중')return {city:'한중',text:'통행증을 잃은 피난민과 수상한 군량 장부가 발견됐다. 산길 수비대가 길을 막고 있다.'};return oldLocalEvent()};
const travelCore08=travelBefore07;
travelTo=function(target){
 if(!S)return;ensureTravel();
 if(window.__travelBusy)return;
 if(target===S.location){let ticker=document.getElementById('map-ticker');if(ticker)ticker.textContent='현재 '+target+'에 있습니다.';return}
 const origin=S.location, before=S.journeys.length;
 S.flags.r07ReturnScene=(S.scene==='r07_city_done'||S.scene==='r08_hanzhong_result')?(S.flags.r07ReturnScene||'crossroads'):S.scene;
 // Finish the animation even if the map is left mid-journey. Prevents an inaccessible world map.
 const path=routeBetween(origin,target);
 window.__travelBusy=true;
 const start=performance.now(),duration=Math.max(750,(path.length-1)*420);
 function tick(now){
  const t=Math.min(1,(now-start)/duration);
  if(tab==='천하도'&&document.getElementById('world-map')){
   paintWorldMap({path,t});
   const ticker=document.getElementById('map-ticker');
   if(ticker)ticker.textContent=`🐎 ${S.name} · ${origin} → ${target} 이동 중 ${Math.round(t*100)}%`;
  }
  if(t<1){requestAnimationFrame(tick);return}
  window.__travelBusy=false;
  if(S.location!==origin)return;
  S.journeys.push({from:origin,to:target,path,date:`${S.year}년 ${S.month}월`});
  S.location=target;advance(Math.max(1,Math.ceil((path.length-1)/3)));
  S.flags.r07Visited=S.flags.r07Visited||{};
  S.flags.r07Visited[target]=(S.flags.r07Visited[target]||0)+1;
  record(`${origin}에서 ${target}까지 여행했다. 경유: ${path.join(' → ')}.`);
  S.scene=target==='한중'?'r08_hanzhong':'r07_city';
  record(`${target}의 새로운 사건을 마주했다.`);
  tab='연대기';save();render();
 }
 requestAnimationFrame(tick);

  body=war?`${city}의 주막은 피난민과 부상병으로 가득하다. 군영 소식을 아는 손님이 조심스럽게 말을 건다.\n“전선에서 돌아왔소. 무사히 돌아갈 수 있을지 모르겠군.”`:`${city}의 주막에 들어가 따뜻한 음식과 술을 주문했다. 구석에 앉아 있던 여행객이 빈자리를 가리킨다.\n“이 근처 사람은 아닌 듯하군요. 잠시 이야기라도 나누시겠습니까?”`;
  let ob=f.townContacts[cid]||{name:alias,meet:0,known:false,status:'이름을 모르는 손님'};ob.meet++;
  if(ob.meet>=2){ob.known=true;ob.status='주막에서 여러 차례 만난 지인';}else{ob.status='처음 대화한 낯선 이';}
  f.townContacts[cid]=ob;contact={...ob,id:cid};pending=true;
  if(ob.known){body+=`\n\n그는 자신의 이름과 사는 곳을 밝혔다. “사람들은 나를 ${alias}(이)라 부르오.”`;record(`${city}의 여관에서 ${alias}의 이름을 알게 되었다.`)}
  else record(`${city}의 여관에서 이름 모를 여행객과 마주쳤다.`);
 }else if(type==='market'){
  title=war?'전시 물자 시장':'북적이는 장터';body=war?`${city} 시장의 물자는 귀해졌다. 한 상인이 부상병들에게 약재를 나눠 줄지 망설인다. 당신이 짐 옮기기를 돕자 피난민이 감사 인사를 건넨다.`:`${city}의 시장에서 ${names[(count+1)%names.length]}이(가) 물건을 잃어버렸다. 당신이 함께 찾아주자 상인은 이곳의 길과 사람들에 관한 정보를 알려준다.`;
  mod('매력',2);record(`${city}의 ${war?'전시 물자 시장':'시장'}에서 사람들을 도왔다.`);
 }else if(type==='training'){
  title=war?'급조된 방어진':'성 밖의 훈련장';body=war?`${city} 성 밖에서 군사들이 무기를 정비한다. 부상자를 대신해 방패 사용법을 가르치며 하루를 보냈다.`:`${city} 훈련장에 모인 무인들과 가벼운 대련을 했다. ${names[(count+2)%names.length]}이(가) 당신의 자세를 보고 조언을 남겼다.`;
  mod('무력',2);record(`${city}에서 무예를 단련했다.`);
 }else{
  title=war?'급히 마련한 숙영지':'고요한 객점';body=war?`${city}의 숙소는 피난민 때문에 붐빈다. 자리를 나누어 쓰며 몸을 쉬게 했다.`:`${city}의 객점에 짐을 풀고 여행 기록을 정리했다. 다음 날 여정을 위해 충분히 쉬었다.`;
  S.hp=Math.min(100,(S.hp||70)+12);record(`${city}에서 쉬며 체력을 회복했다.`);
 }
 f.townAction={key:state.k,title,body,contact,pending};save();render();
}
function townResponse(answer){if(!S)return;let act=S.flags?.townAction;if(!act||!act.pending)return;
 act.pending=false;if(answer==='talk'){
  act.body+='\n\n당신은 고향과 여정에 관해 이야기를 나누었다. 상대는 다음에 다시 만나면 더 많은 이야기를 들려주겠다고 약속했다.';mod('매력',1);record(`${S.location}의 여관에서 낯선 사람과 긴 대화를 나누었다.`);
 }else{act.body+='\n\n당신은 인사를 나누고 여관을 나섰다. 만남이 다시 이어질지는 알 수 없다.'}save();render();
}
const beforeLifeRender=render;
render=function(){beforeLifeRender();if(!S)return;const story=document.querySelector('.story');if(story)story.insertAdjacentHTML('beforeend',showTown());const brand=document.querySelector('.brand');if(brand&&brand.childNodes.length)brand.childNodes[0].textContent='삼국지 · 무명의 영웅 v0.8.1'};

boot();
